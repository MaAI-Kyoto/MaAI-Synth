  - "施設の広報窓口"
  - "博物館、美術館のチケット売り場"

# 客と担当者の型。必ず「客側と担当者側」の両方が入る形にする。
relationships:
  - "購入者と店舗スタッフ"
  - "オンラインショップの利用者とサポート担当者"
  - "予約客と受付担当者"
  - "会員と会員サービス担当者"
  - "荷物の受取人と配送センター担当者"
  - "イベント参加者と総合案内スタッフ"
  - "請求を確認する利用者と経理担当者"
  - "アカウント利用者と操作サポート担当者"
  - "ポイント会員とポイントサービス担当者"
  - "常連客と店の顔馴染みの店員"
  - "家電製品の購入者と修理受付担当者"
  - "宿泊予約者とホテル予約担当者"
  - "定期購入サービスの利用者と契約変更担当者"
  - "チケット購入者と販売サイトのサポート担当者"
  - "外商顧客と担当店員"
  - "来館者と博物館・美術館のインフォメーションカウンター担当者"
