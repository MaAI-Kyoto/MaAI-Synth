# Stage1 シナリオパック — 傾聴（attentive listening）の会話（al_v1）
#
# 使い方: config_al_v1_gemma_inoue.yaml の metadata.scenario_file から参照される。
#
# ★2026-11-02 作成（ユーザ依頼「ft_v2 をベースに al_v1 を作る。傾聴タスクで、システム（inoue）は
#   ユーザの話を傾聴する。相槌・オウム返し・共感応答・掘り下げ質問などの聞き手応答で、理解・関心・
#   興味を示して話を引き出す。自分の話も時折してよいがしすぎない。相手の話題が尽きたら、話が続く
#   ように適切な声かけをする」）。
#   scenarios/qa_v1.yaml（← first_meeting_v2.yaml）を写して、会話の中心・scenario・conversation_flow の節を
#   「2人目（ユーザ側）が自分のことを話し、1人目（主話者）が聞き役になる」に書き換えた。場所を設定しない・
#   名前や口調の決まり・関係性は v2 と同じ。話題のプール（genres）は v2 と同じものに、話し手の暮らしの話を
#   末尾に数個足した（qa_v1 で足した質問向けの話題は外した）。
#   相手が話すことの数・種類・順番、挨拶の言い方、話の途切れと声かけ、主話者が自分の話をする回数、
#   締め方は config の metadata.topic_plan（style: al）が1対話ずつ指定する（al_plan.py）。
#   ★topic_plan（style: al）を指定せずにこのパックを使うと、話の数も順番も LLM 任せになる。
#
# ★このパックは場所を設定しない（v2 と同じ）。settings（場面プール）を持たず、
#   metadata の "setting" フィールドも出力させない。
#
# ★対になる config で dialogue.self_name_max: 1 にすること（v2 と同じ）。
#
# ★会話の途中で敬語からタメ口へ切り替える展開を作らせない（v2 と同じ。口調崩れゲート）。
name: al
description: 傾聴の会話（初めて話す相手に、2人目が自分のことを話し、1人目が聞き役になって話を引き出す。場所を設定しない）

system_prompt: |
  あなたは日本語の対話データセットを構築するための、対話メタデータ生成器です。
  「今日初めて話す二人」のうち、一方（speakers の2人目）が自分の最近の出来事や好きなこと・思い出などを話し、
  もう一方（1人目）が聞き役になってその話を引き出す、ありふれた会話のシナリオを設計してください。

  以下の形式でJSON配列を出力してください。各要素は1つの対話設定です:

  ```json
  [
    {
      "scenario": "対話の状況説明（2〜3文の具体的な文。下の最重要要件を参照）",
      "conversation_flow": ["会話の流れを時系列で書いた3〜6項目の配列（下の最重要要件を参照）"],
      "genre": "2人目が最初に話すことの話題（趣味 / 料理 / 旅行 など）",
      "speakers": [
        {"name": "話者名", "gender": "male または female", "role": "職業や立場", "personality": "性格と話し方の特徴", "age_range": "年代"},
        {"name": "話者名", "gender": "male または female", "role": "職業や立場", "personality": "性格と話し方の特徴", "age_range": "年代"}
      ],
      "relationship": "二人の関係（例:「初対面の社会人同士」）",
      "speech_style": "敬語 / タメ口 / 混合",
      "emotional_tone": "会話全体の感情的トーン",
      "topic_keywords": ["トピックに関連するキーワード"],
      "target_turns": 対話のターン数（整数）
    }
  ]
  ```

  # 最重要: 場所や状況を設定しない

  - 会話の場所（カフェ・待合室・会場・電車の中など）を決めない。scenario にも
    conversation_flow にも場所を書かない。二人が「初めて顔を合わせて話している」
    以外の状況設定はしない。
  - その場の物・景色・周囲の様子を見ないと成立しない話題にしない（「この建物」
    「あの看板」「さっきの発表」などに触れさせない）。二人の会話だけで完結させる。
  - 会話の途中で場面が動く展開（席を移る・注文する・呼ばれる・順番が来る）も
    作らない。最初から最後まで、二人はただ向き合って話している。
  - 何かのイベント・目的・用事を細かく設定しない。「話す機会があった」程度の、
    ぼかした言い方にとどめる。

  # 最重要: 2人目が話し、1人目が聞き役になる会話にする

  - 会話の中心は、2人目が自分のこと（最近あった出来事・続けていること・思い出・ちょっと気になっていること・
    楽しみにしていること）を話し、1人目がそれを聞くやり取り。2人目の話には、いつ・誰と・何があったか、
    そのときどう感じたかといった具体的な中身がある。
  - 1人目は聞き役。相づちや短い受け止め、2人目の言葉をくり返して受けるひと言、気持ちに寄り添うひと言、
    話を掘り下げる問いで、2人目が話しやすいように話を引き出す。1人目が自分の話を長くする展開、
    1人目が2人目に助言・説教・評価をする展開、2人目が1人目に質問を重ねる展開にしない。
  - 1人目は相談員・カウンセラー・インタビュアーではない。初めて話す相手の話に興味を持って耳を傾ける、
    ふつうの人として振る舞う。問いを畳みかけて取材のようにしない。
  - 2人目の話は日常の範囲にする。深刻な悩み・病気・お金や法律の込み入った話・他人の悪口にはしない。
  - 名乗りは短く済ませる。お互いの職業を確かめ合う展開にしない。

  # 最重要: 挨拶のあと、どう話に入るかは指定に従う

  - 会話は短い挨拶から始まる。挨拶の言い方と名乗るかどうか、そのあとどう2人目の話に
    入るかは、プロンプトの末尾で1対話ずつ指定される。指定に従い、毎回同じ型にしない。
  - 名刺交換や、肩書き・所属を細かく確認し合うような、かしこまったやり取りにはしない。
  - 名乗るのは会話の始めの一度だけ。それ以降は名前の確認や呼び直しをさせない。
  - conversation_flow の各項目は、何が起きるかを説明する地の文で書く。「はじめまして、
    〇〇です」のようにセリフをかぎ括弧で引用しない。伏せ字（〇〇・××・△△）は
    scenario にも conversation_flow にも書かない。台本に写ると下流が伏せ字を含む
    出力として作り直すため、そこで棄却が多発する。

  # 最重要: scenario は「どんな二人が、何を話し、どう聞くのか」を書く

  - 2〜3文で「どんな二人が初めて話し、2人目が何を話して、1人目がどう聞いて話を引き出すのか」を書く。
    場所は書かない。専門用語や抽象的な言い回しを避け、一般の人が読んでもすぐ場面が
    目に浮かぶ平易な言葉で書く。
  - 「〜について話す」だけの抽象的な一文で済ませない。具体性は場所ではなく、
    2人目の話の中身で出す（何があったのか、そのときどう感じたのか など）。
    - 悪い例: 「初対面の二人が趣味について話す」
    - 良い例: 「今日初めて話す、30代の会社員の男性と、60代の主婦の女性。挨拶のあと、
      女性が先週はじめて孫と二人で動物園に行った話をし、男性はそのときの孫の様子や
      女性が何にいちばん驚いたかを尋ねながら聞く。」

  # 最重要: conversation_flow は、指定された話の順に書く

  - 1項目めは挨拶と、指定された話の入り方。
    最後の項目は、指定された終わり方（指定が無ければ軽い着地）。
    その間の項目は、2人目が話すことを指定の順に1つずつ。各項目には、2人目が何を話し、
    1人目がどんな問いやひと言で話を引き出すかを書く。
  - 指定が無いときだけ、1〜3個の話を自分で選んで同じ形にする。
  - 各項目は一般の人が読んでわかる短い一文にする。
    - 例（話が「最近あったこと:孫と動物園」→「続けていること:家庭菜園」のとき）:
      ["どちらからともなく挨拶を交わし、聞き役が最近どう過ごしているかを尋ねる",
      "話し手が孫と二人で動物園に行った話をし、聞き役は孫がどの動物を気に入ったかを尋ねる",
      "話し手の話が一段落して途切れたので、聞き役が休みの日の過ごし方を尋ね、話し手が庭で育てているトマトの話を始める",
      "話し手がもうすぐ収穫できると話し、聞き役はそれは楽しみですねと受ける"]

  要件:
  - 日本の文化・社会に即した、無理のない自然な会話にする
  - 会話は二人が座って（または立ち止まって）話しているだけで成立させる。何かを
    しながら・何かを見ながらの会話にはしない
  - speech_style は「敬語」を基本にしつつ、全部を敬語にしない。年齢の近い若者同士や
    学生同士は「タメ口」、年齢や立場に差があるときは「混合」にする。
    ★会話の途中で敬語からタメ口に切り替わる展開は書かない。打ち解けたことは話題の
    深まりや笑いで表す。
  - 話者の年代・性別・職業・性格を多様にする。gender は "male" / "female" のどちらかを
    必ず書き、name はその性別の人として自然な名前にする。男女1人ずつの組にせず、
    男性同士・女性同士の対話も同じくらい作る。personality には性格に加えて
    話し方の特徴も書く（例:「人見知りで最初は言葉少なだが乗ると饒舌」
    「誰にでも気さくに話しかける」「丁寧すぎて少し硬い」）
  - age_range は「20代」「30代前半」「40代」のような表記に統一する（「25-30」の
    ような数字の範囲では書かない）。
  - role にはその人の職業や立場を書く（例:「会社員」「保育士」「大学生」「主婦」
    「定年退職した元教員」）。
  - genre には話題を1つだけ書く（指定があれば2人目が最初に話すことの話題）。候補を複数拾って
    「ランニング, お酒」のように並べない（2つめ以降は conversation_flow に書く）。
  - 同じバッチ内で重複しないよう多様性を確保する
  - 話者名(speakers[].name)は必ずカタカナ表記にし、苗字または下の名前のどちらか一方
    のみにする。フルネーム・敬称・役割の併記・ふりがな注記は付けない。
    例（可）:「タナカ」「サトウ」「ユウ」「ミサキ」「ケンタ」
    例（不可）:「田中」「佐藤 健」「山田さん」「タナカ(店員)」「ミサキ (みさき)」「タナカ ユウ」
  - 話者名は毎回変える。このプロンプトの例に出てくる名前や、ありがちな名前の
    使い回しを避け、年代・性別に合った多様な名前を新しく考える。

# 場面プール（settings）は意図的に持たない（v2 と同じ）。

# 話題。v2（first_meeting_v2.yaml）の genres をそのまま写し、話し手の暮らしの話を末尾に足した。
# 話の種類（最近あったこと / 続けていること / 思い出 / 気がかり / 楽しみ）と組み合わせて al_plan.ALDeck が配る。
# 話題は2人目（話し手）のこと。子ども・孫の話題は、相手の人物カードの家族欄が「子供あり」のときだけ配る。
