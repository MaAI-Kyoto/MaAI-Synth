# Stage1 シナリオパック — 接客（客の簡単な問い合わせに、担当者が丁寧に案内する2人対話）
#
# 使い方: config_cs_v1.yaml の metadata.scenario_file から参照される。
#
# 元は旧構成（generate_metadata.py にプロンプトを直書きしていた頃）向けに編集した
# customer_service.yaml。現行の generate_metadata.py（scenarios/*.yaml を読み、
# genres / settings / relationships の3プールを DiversityTracker が配る構成）と、
# 下流の Stage2 ゲートに合わせて次を調整した:
#   - speech_style を「敬語」固定から「敬語 / 混合」にした。担当者は常に敬語で、
#     客が子ども（13歳以下）や親しい常連でタメ口を使う対話だけ「混合」にする。
#     「敬語」の対話は Stage2 の口調崩れゲート（casual_leak）が**客の発話にも**効き、
#     文末の「〜だよ」「〜てる」で作り直しになるため。
#   - 「個人情報・注文番号などの具体的な値は書かない」は残しつつ、架空の店名・
#     商品名・日付・金額は具体的に書かせる（Stage2 は伏せ字「○○」を弾く）。
#   - conversation_flow はセリフの引用・伏せ字を書かせない（first_meeting と同じ。
#     台本に写ると Stage2 の伏せ字ゲートで棄却が出る）。
#   - settings の「チャット窓口」2件は音声対話にならないので電話窓口に置き換えた。
#   - relationships の「ポイント会員と特別会員」「博物館、美術館のインフォメーション
#     カウンター担当者」は客側／担当者側が欠けていたので両者の型に直した。
#   - 現行パック（general / first_meeting）と揃えた共通ルール（カタカナ名・年代表記・
#     男女の組み合わせ・会話だけで完結する場面）を足した。
#
# ★対になる config（config_cs_v1.yaml）の dialogue.enrich は、担当者にフィラーを
#   機械で差し込まないよう filler_inject: false ほかを本番 config から下げてある。
name: customer_service
description: 接客（客の簡単な問い合わせに担当者が丁寧に案内する2人対話。店頭・電話の窓口）

system_prompt: |
  あなたは日本語の対話データセットを構築するための、対話メタデータ生成器です。
  客の簡単な問い合わせに、担当者が丁寧に案内する「接客」の対話シナリオを設計してください。

  以下の形式でJSON配列を出力してください。各要素は1つの対話設定です:

  ```json
  [
    {
      "scenario": "誰が何について問い合わせ、担当者がどう案内するか（1〜2文の具体的な文。下の最重要要件を参照）",
      "conversation_flow": [
        "客が用件を伝える",
        "担当者が必要なことを確認する",
        "担当者が簡単に案内する",
        "客が納得して会話を終える"
      ],
      "genre": "問い合わせの種類",
      "speakers": [
        {"name": "カタカナの名前", "gender": "male または female", "role": "客", "personality": "性格と話し方", "age_range": "年代"},
        {"name": "カタカナの名前", "gender": "male または female", "role": "担当者", "personality": "性格と話し方", "age_range": "年代"}
      ],
      "setting": "問い合わせ窓口（店頭のカウンター・電話の窓口など）",
      "relationship": "客と担当者の関係",
      "speech_style": "敬語 / 混合",
      "emotional_tone": "会話全体の感情的トーン（落ち着いて丁寧 など）",
      "topic_keywords": ["問い合わせに関連するキーワード"],
      "target_turns": 対話のターン数（整数）
    }
  ]
  ```

  # 最重要: 客と担当者の2人による、1つの簡単な問い合わせにする

  - 話者は客と担当者の2人にする。role は「客」「担当者」のどちらかをそのまま書く
    （役割名を変えたり、括弧で補足を足したりしない。具体的な立場は setting と
    relationship で表す）。
  - 問い合わせは1つだけにし、複雑なトラブル・クレーム対応にしない。
    最後は解決するか、次に何をすればよいかが分かる形で終える。
  - 個人情報、注文番号、パスワードなどの具体的な値は書かない。会話の中で長い番号や
    記号列を読み上げる展開（注文番号を伝える・住所を復唱する など）も作らない。
    ただし架空の店名・商品名・日付・金額・時刻のような固有のディテールは具体的に書く
    （「○○」「××」のような伏せ字にしない。伏せ字は下流で作り直しの原因になる）。
  - 医療・法律・金融など、専門家の判断が必要な内容は扱わない。
  - 会話だけで問い合わせが完結する場面にする。商品を一緒に見ながら・端末を操作しながら・
    店内を移動しながらのように、その場の物や作業を見ないと成立しない展開にしない。
  - 窓口は店頭（対面）でも電話でもよいが、声で話す場面に限る（チャット・メールにしない）。

  # 最重要: scenario は「誰が・何を・どう案内するか」を具体的に書く

  - 1〜2文で、客の用件と担当者の案内の中身を書く。専門用語や抽象的な言い回しを避け、
    一般の人が読んでもすぐ場面が目に浮かぶ平易な言葉で書く。
  - 「〜について問い合わせる」だけの抽象的な一文で済ませない。用件のきっかけや、
    案内の結論（何ができて何ができないか・次に何をすればよいか）まで書く。
    - 悪い例: 「客が配送について問い合わせ、担当者が案内する」
    - 良い例: 「先週ネットで注文したコートの届く日を、出張と重なりそうなので翌週に
      遅らせたい客。担当者は出荷前なら日付を変えられることを伝え、希望の曜日と
      時間帯を確認して変更を受け付ける。」

  # 最重要: conversation_flow は「用件→確認→案内→終了」の4項目にする

  - 1. 客が用件を伝える
    2. 担当者が案内に必要なことを確認する
    3. 担当者が結論と手順を分かりやすく案内する
    4. 客が納得し、担当者が締めの挨拶をして会話を終える
  - 項目は必ず4個にする。各項目は、何が起きるかを説明する短い地の文で書く。
    「いらっしゃいませ」「〜でよろしいでしょうか」のようにセリフをかぎ括弧で引用しない。
    伏せ字（〇〇・××・△△）は scenario にも conversation_flow にも書かない。
    - 例: ["客が、先週注文したコートの配送日を翌週にずらせないかと尋ねる",
      "担当者が、注文が出荷前かどうかと、希望の曜日と時間帯を確認する",
      "担当者が、出荷前なので変更できることと、変更後に届く日を案内する",
      "客がお礼を言い、担当者が締めの挨拶をして会話を終える"]

  # 担当者の性格、キャラクターについて

  - 接客対応の基本は、丁寧で落ち着いている。
  - 正しい日本語と自然な敬語を使う。
  - 顧客の一人一人の特性や好みを理解し、顧客の気持ちに寄り添える。
  - 顧客側から発せられる冗談・失敗談を受け止め、ユーモアを含めて返答できる。
  - コミュニケーション能力、対話力（言葉使いやユーモア/ラグジュアリーの匙加減）を持ち、
    顧客が今求めている情報を引き出すことができる。
  - 適切な質問をすることで、顧客の今求めている情報を整理し、情報の刷新、違う視点、
    共感、共有の判断がその場でできる。
  - personality には、この基本の上に、その担当者らしさ（例:「テキパキと要点を押さえる」
    「ゆっくり噛み砕いて説明する」「常連の顔と好みを覚えている」）と話し方の特徴を書く。

  # 客の多様性

  - 客の年代・性別・性格・話し方を多様にする。子どもから70代以上まで幅広く出す。
    personality には性格に加えて話し方の特徴も書く（例:「せっかちで結論を急ぐ」
    「心配性で何度も聞き返す」「照れ隠しに冗談を言う」「機械に不慣れで用語が分からない」）。
  - 13歳以下の子どもが客のときは、施設の受付・店頭・忘れ物の窓口など、子どもが一人で
    尋ねるのが自然な場面に限る（支払い・契約・個人情報の変更にはしない）。全体の
    ごく一部にとどめる。
  - 常連客・外商顧客のように、担当者と面識がある客の対話も一部に入れる
    （relationship にそう書く）。

  要件:
  - 日本の文化・社会に即した、無理のない自然な接客場面にする。
  - speech_style は「敬語」を基本にする。担当者は常に敬語。客が子ども（13歳以下）や
    親しい常連で、客だけがタメ口で話す対話に限って「混合」にする（担当者がタメ口に
    なる「混合」は作らない）。
  - emotional_tone は「落ち着いて丁寧」を基本にしつつ、客側の様子（少し急いでいる・
    不安そう・和やか・照れ笑い など）で変化をつける。
  - gender は "male" / "female" のどちらかを必ず書き、name はその性別の人として自然な
    名前にする。男女1人ずつの組にせず、男性同士・女性同士の対話も同じくらい作る。
  - age_range は「20代」「30代前半」「40代」「70代」のような表記に統一する
    （「25-30」のような数字の範囲では書かない）。13歳以下の子どもは「10歳」「12歳」の
    ように歳で書く。
  - genre には問い合わせの種類を1つだけ書く。候補を複数拾って並べない。
  - setting は候補から1つ選ぶか、それに準じる窓口を1つ書く。
  - 同じバッチ内で重複しないよう多様性を確保する。
  - 話者名(speakers[].name)は必ずカタカナ表記にし、苗字または下の名前のどちらか一方
    のみにする。フルネーム・敬称・役割の併記・ふりがな注記は付けない。
    例（可）:「タナカ」「サトウ」「ユウ」「ミサキ」「ケンタ」
    例（不可）:「田中」「佐藤 健」「山田さん」「タナカ(店員)」「ミサキ (みさき)」「タナカ ユウ」
  - 話者名は毎回変える。このプロンプトの例に出てくる名前や、ありがちな名前の
    使い回しを避け、年代・性別に合った多様な名前を新しく考える。
  - 伏せ字やテンプレート記号は使わない。

# 問い合わせの種類。DiversityTracker が使用頻度の低い順に推薦するので、似た項目が
# 並んでいても害はない（まんべんなく出る）。
genres:
  - "商品の問い合わせ"
  - "在庫確認"
  - "注文内容の確認"
  - "配送予定の確認"
  - "返品・交換"
  - "キャンセル"
  - "予約変更"
  - "料金プラン"
  - "請求内容の確認"
  - "アカウント操作"
  - "サービスの使い方"
  - "故障・修理"
  - "保証内容の確認"
  - "洋服や靴のサイズの変更"
  - "商品の色違いに変更希望"
  - "ポイント・クーポンの利用"
  - "支払い方法の変更"
  - "次回イベント開催の有無・確認"
  - "商品を取り置きしたい時の問い合わせ"
  - "入荷予定・再入荷通知の確認"
  - "商品レビュー・感想の投稿方法"
  - "店舗での受け取り方法の確認"
  - "配送日時指定の変更"
  - "SALEの開催の詳細確認"
  - "配送先住所の変更"
  - "ログイン・パスワードの再設定"
  - "決済エラー・支払い失敗"
  - "領収書・インボイスの発行"
  - "個人情報の変更・削除"
  - "外商顧客のための専門的アドバイス"
  - "店舗の営業時間・所在地の確認"
  - "ギフト包装・のしの依頼"
  - "商品の取り扱い方法・お手入れ方法"
  - "商品の互換性・対応機種の確認"
  - "会員特典・ランク制度の確認"
  - "施設周りの観光地について問い合わせ"
  - "駐車場・店舗へのアクセス"
  - "駐車場の有無"
  - "駐車料金、駐車可能時間、駐車場に関するお問い合せ"
  - "施設周辺コインパーキングの所在地と料金体系"
  - "イベントの見どころ"
  - "イベントの概要(開催期間、開催時間、休館日）"
  - "イベントの巡回先"
  - "商品の組み立て・設置方法"
  - "入館券・入場券の購入方法"
  - "展示・アトラクションの開催時間の確認"
  - "館内・園内の施設案内"
  - "混雑状況・待ち時間の確認"
  - "車いす・ベビーカーの利用案内"
  - "テイクアウト・デリバリーの注文確認"
  - "メニュー・アレルギー情報の問い合わせ"
  - "会計・支払い方法の問い合わせ"
  - "席の種類（座敷、テーブル、団体席）の問い合わせ"
  - "コース料理・飲み放題の内容確認"
  - "子ども用メニュー・ベビーチェアの利用"
  - "忘れ物の問い合わせ"

# 窓口。声で話す場面だけ（チャット・メールの窓口は音声対話にならないので置かない）。
settings:
  - "電話のお客様窓口"
  - "オンラインショップの電話サポート窓口"
  - "店舗のサービスカウンター"
  - "施設の受付窓口"
  - "予約サービスのサポート窓口"
  - "製品のサポート窓口"
  - "会員サービスの問い合わせ窓口"
  - "配送センターの問い合わせ窓口"
  - "イベント会場の総合案内所"
  - "百貨店のインフォメーションカウンター"
  - "ホテルのフロント"
  - "薬局のレジカウンター"
  - "家電量販店の修理受付カウンター"
  - "ホテルの予約変更専用窓口"
  - "定期購入サービスの問い合わせ窓口"
  - "チケット販売サイトの電話サポート窓口"
  - "百貨店外商様窓口"
  - "施設の広報窓口"
  - "博物館、美術館のチケット売り場"

# 客と担当者の型。必ず「客側と担当者側」の両方が入る形にする。
relationships:
  - "購入者と店舗スタッフ"
  - "オンラインショップの利用者とサポート担当者"
  - "予約客と受付担当者"
  - "会員と会員サービス担当者"
  - "荷物の受取人と配送センター担当者"
  - "イベント参加者と総合案内スタッフ"
  - "請求を確認する利用者と経理担当者"
  - "アカウント利用者と操作サポート担当者"
  - "ポイント会員とポイントサービス担当者"
  - "常連客と店の顔馴染みの店員"
  - "家電製品の購入者と修理受付担当者"
  - "宿泊予約者とホテル予約担当者"
  - "定期購入サービスの利用者と契約変更担当者"
  - "チケット購入者と販売サイトのサポート担当者"
  - "外商顧客と担当店員"
  - "来館者と博物館・美術館のインフォメーションカウンター担当者"
