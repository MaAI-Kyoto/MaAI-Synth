# fish（Stage4）に渡す直前に読みを開く語（tts_reading.py が使う）。
# 台本・manifest・字幕は原文のまま。合成入力だけがかなになる。
#
# 追加の仕方: check_tts_readings.py（ASR で読みを突き合わせる）の出力 diffs に
# 「語:期待の読み→聞こえた読み」が繰り返し出た語を、期待の読みで足す。
# 同じ字で読みが変わる語は not_before / not_after（正規表現）で文脈を絞る。
#   例: 一足: {reading: いっそく, not_before: "先|早"}   ← 「一足先に」は「ひとあし」
#
# 出典は各行のコメント（人手評価＝人手評価シート 2026-09-25 / ASR＝check_tts_readings.py）。
readings:
  # のし・贈答（人手評価: 表書き→ひょうがき、内祝→うちしゅく / ASR: 内のし→からだのし・うたいのし）
  表書き: おもてがき
  内祝い: うちいわい
  内祝: うちいわい
  御祝い: おいわい
  御祝: {reading: おいわい, not_before: "儀"}
  内のし: うちのし
  外のし: そとのし
  熨斗: のし
  水引: みずひき
  結び切り: むすびきり
  蝶結び: ちょうむすび
  # ★2026-09-26 全シナリオで有効にしたので、日常会話の「寿司」「寿命」「米寿」を巻き込まないよう前後の漢字を除外
  寿: {reading: ことぶき, not_before: "司|命|限", not_after: "[一-龥]"}
  御結婚御祝: ごけっこんおいわい
  御歳暮: おせいぼ
  御中元: おちゅうげん
  # 数え方（ASR: 一足→ひとわく）
  一足: {reading: いっそく, not_before: "先|早|遅|違"}
  二足: にそく
  一泊: いっぱく
  二泊: にはく
  三泊: さんぱく
  # 業界用語（人手評価: 焼成が「小生」に聞こえる。Stage2 でも言い換えるが既存データ用に残す）
  焼成: しょうせい
  同梱: どうこん
  外商: がいしょう
  # 接客の定型（ASR: 承ります→うけたもあります 39件中約10件、お電話→ごでんわ 45件中5件）
  お電話: おでんわ
  承ります: うけたまわります
  承りました: うけたまわりました
  お問い合せ: おといあわせ
  # ASR: がたついて→かたづいて
  がたつ: がたつ
  # ASR（2026-09-26、9/25 版の100対話）: 一目惚れ→いちもべぼれ、名店→れいてん、蝶結び→こむすび（登録済み）
  一目惚れ: ひとめぼれ
  名店: めいてん
  # ★2026-09-26 初対面コーパスの読み検査。話し言葉の「お家」は「おうち」（fish もそう読むが、
  #   期待の読みが「おいえ」になり読み違いの引き直しを無駄に起こす）
  お家: おうち
  # ★2026-10-24 聴取（ft_sil_v1）: 「心許ない」を読み違えた。「心許な」で「心許なく・心許なさ」も覆う
  #   （「心許せる」は「な」が続かないので巻き込まない）
  心許な: こころもとな
  # ★2026-11-09 al_v1 試走10f（ASR の読みの検査で引き直しても直らなかった語。古地図→ふるちず、何色→なにしょく）
  古地図: こちず
  何色: {reading: なにいろ, not_before: "か(?![？?])"}   # 「何色か用意」は なんしょく
  # ★2026-11-15 聴取（pocket v11s1g 対話3）: 「土作り」を pocket が「どつくり／とつくり」と読む（10 本中 10 本。「土づくり」「つちづくり」は 10/10 で正しい）。
  #   前に漢字が付く「粘土作り」「腐葉土作り」は読みが違うので開かない
  土作り: {reading: つちづくり, not_after: "[一-龥]"}
  土づくり: {reading: つちづくり, not_after: "[一-龥]"}
