# ==========================================================================
# TTS method "irodori-yomi-v4" (default of this repository)
# ==========================================================================
# Writing `tts: {engine: irodori-yomi-v4}` in a config makes the loader deep-merge this file into `tts`
# after all `extends:` are resolved (this file wins). To change the method, do not edit this file:
# copy it to a new name (e.g. my-irodori.yaml) and set `tts.engine: my-irodori` (see readme/extending.md).
#
# What it does
#   - Model: Irodori-TTS-v4.1-Small-Yomi (https://huggingface.co/takuma104/Irodori-TTS-v4.1-Small-Yomi),
#     served by vLLM-Omni with the Irodori pipeline (third_party/irodori_vllm/). 48 kHz output.
#     Requests go to `tts.fish_speech.base_url` (POST /v1/audio/speech). The server opens the reference
#     WAV files by path, so it must see the same file system as the Stage 3 worker (e.g. the same machine).
#   - Voice reference: one take of the voice bank + sibling takes of the same speaker (<id>_t<N>.wav), 60 s
#     in total; speaker CFG 2. 24 diffusion (rectified-flow) steps.
#   - Length: moras / 7.3 + 0.3 s (min 0.8 s); backchannels at least as long as the human median.
#     Edge silences are trimmed; a take that is still voiced at the end gets a 0.12 s fade.
#   - Take selection: body utterances are scored over up to 8 takes (naturalness, speaking rate, pauses,
#     tail noise, cut-off voice; 4 first, 8 only when needed). Short utterances: 6 takes.
#   - Backchannels inserted in Stage 3 (refine): the speaker's own previous utterance is put in front of the
#     reference and up to 24 takes (8/16/24 staged) are scored with a voice-continuity bonus (WavLM).
#   - Laughter at the head of a turn is synthesized separately and joined (generated once per turn).
#   - Reading check: ASR (kotoba-whisper) vs. dictionary readings; misread takes are re-drawn.
#   - Backchannel loudness -5 dB. No speech restoration (Sidon) on the output. Dialogue audio is FLAC.
# Internally this runs the reference-audio TTS path `engine: fish_speech` with `backend: irodori_vllm`
# (generate_tts.IrodoriVllmSynth). Output variants: audio/maai (after MaAI retiming) and audio/maai_ref
# (after backchannel refinement = final).
# ==========================================================================
engine: fish_speech
fish_speech:
  backend: irodori_vllm
  checkpoint: Irodori-TTS-v4.1-Small-Yomi
  vllm_model: irodori          # --served-model-name of the TTS server
  concurrency: 32
  bwe: false
  moss_commas: keep
  irodori:
    num_steps: 24              # diffusion steps (Irodori default 40; 24 = same quality in listening tests, ~1.4x faster)
    refs_sec: 60               # seconds of reference audio (one take + sibling takes)
    mora_rate: 7.3             # target length = moras / mora_rate / 0.94 + pad_sec
    cfg_scale_speaker: 2
    text_replace:              # applied to the TTS input only (pitch accent of the name)
      イノウエ: 井上
    laugh_emoji: split
    laugh_reuse: true
    short_takes: 6
    mute_end_click: true
    request_timeout: 180
    retries: 2
    pad_sec: 0.3
    min_sec: 0.8
    edges:
      lead_keep: 0.05
      tail_keep: 0.15
      end_fade: 0.12
      start_fade: 0.01
    short_flaw:
      cut: 5.0
      blob: 3.0
      dur: 3.0
      head: 1.0
      edge_blob: 1.0
    outer_clean:               # silence short clicks before the first / after the last voiced region
      max_click: 0.06
      min_gap: 0.06
      max_db: -20.0
    short_clean:
      max_click: 0.1
      min_gap: 0.08
    short_len_bc: 1.0
    bc_prev_ref:
      enabled: true
      sim_weight: 3.0
      takes: 24
      staged:
        first: 8
        step: 8
        thresh: -1.4
      pitch:                   # penalty for falsetto-like backchannels (semitones above the previous utterance)
        weight: 5.0
        lo: 4.0
        hi: 8.0
      tmp_dir: data/_tmp/irodori_prevref   # temporary WAVs read by the TTS server (made absolute at run time)
  best_of:
    enabled: true
    criterion: quality
    takes: 8
    staged:
      first: 4
      step: 4
      thresh: 1.4
    short_single: true
    w_nat: 10
    w_kps: 5
    w_pause: 10
    w_tail: 3
    w_cut: 3
  regen_on_misread:
    ruby:
      enabled: false
loudness:
  bc_gain_db: -5.0
audio_format: flac
sidon:
  in_worker: false
