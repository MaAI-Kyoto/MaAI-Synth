#     傾聴の節の聞き役の応答を「話し手が直前に伝えたこと（うれしい・つらい・意外・ふつうの説明）に合わせる」形に、
#     聞き役がふつうの説明を「そうなんですね」で受けるのは許す。校閲に「崩れたくり返し（書くですね）」「硬い書き言葉」
#     「つらい話への理由の問いただし」「一般論・評価・励ましのまとめ」を足した。
