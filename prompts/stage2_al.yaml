#   (2) system_prompt に「# 最重要: 聞き役が話を引き出す会話（傾聴）」の節を足した（発話の長さの節の直前）
#   (3) proofread_prompt の冒頭の役割と「直してはいけないもの」に、聞き役の短い応答を足した
#   ★2026-11-02 試走6: 「ふふ、それは悲しいですね」「あはは、それは今思うと可愛らしい失敗ですね」（面接に落ちて恥ずかしかった話）。
