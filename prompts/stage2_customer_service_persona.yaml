# ==========================================================================
# Stage2（対話生成）のプロンプトパック — customer_service_persona
# ==========================================================================
# 接客・担当者固定ペルソナ版（固定の担当者＝主話者(ch0)が客の問い合わせに案内する。
# configs/cs_v1.yaml など）
#
# config の dialogue.prompt_file で選ぶ（未指定なら prompts/stage2_general.yaml）。
#   接客               config_cs_v1*.yaml            → prompts/stage2_customer_service.yaml
#   接客・固定ペルソナ configs/cs_v1.yaml など
#                                                    → prompts/stage2_customer_service_persona.yaml
# ★このファイルはシナリオごとに独立している。ここを編集しても他のシナリオの
#   プロンプトは変わらない（逆に、良くなった書き方は手で各パックに反映すること）。
#
# --- prompts/stage2_customer_service.yaml からの差分 --------------------------
# 本文（system_prompt / enriched_section / laugh_section / profile_patches）は
# 接客パックと同一。担当者の名前・性別・年代は metadata.speakers の1人目に入って
# くるので、Stage2 のプロンプト側には persona 固有の文言を置かない（inoue 版と
# 別の担当者ペルソナの版でこのパックを共有する）。変えたのは名乗りの扱いだけ:
#   - allow_self_name_lines: 「応対の始めに一度だけ名乗ってよい」→「電話の窓口では
#     最初の応答で店名・部署名に続けて一度だけ名乗る。店頭では名乗らなくてよい」。
#     ch0 の主話者の名前を本人の口から出すのが目的（初対面コーパスの実測では主話者の
#     名前は相手の呼びかけでしか出なかった: 60対話で相手36回 / 本人0回。接客では
#     客が担当者を名前で呼ぶ機会がさらに少ないので、名乗りで補う）。
#     対になる config は dialogue.self_name_max: 1（既定 0 では no_self_name_lines の
#     ままで名乗らない）。2つ目の行（呼びかけの話者取り違え）は profile_patches.gemma
#     の old と一致させる必要があるので変えていない。
# それ以外の注意点（enrich の差し込みを切る理由など）は接客パックの冒頭を参照。
#
# ★2026-09-22 ユーザー指摘「さようでございますか？」「ブライダルコースです。」（復唱の
#   言い切り）。どちらも**モデルは正しく書いていて後処理が壊していた**（A/B 各腕14生成の
#   生出力で「か？」0件・復唱の言い切り 0/39 件。experiment_readback_ab.py 参照）。
#   「か？」は llm_client.emphasize_question_marks の一律置換、言い切りは thin_ne が
#   復唱の「ね」を落としていたもの。プロンプトに例を足す案は効果ゼロ（ゲート再試行が
#   1.43→1.64 回/対話と増えた）ので、このパックには入れていない。同じ症状を見ても
#   プロンプトを触らず後処理（generate_dialogues.readback_sites / thin_ne の protect）を疑うこと。
#
# ★2026-09-22（2回目）ユーザー指摘「ご利用です？」「お調べいたします。」
#   「いらっしゃるんです。」「ご連絡くださいね。」。前3つはすべて thin_ne が担当者の
#   機能語の「ね」を落としたもの（「ですね？」→「です？」は後処理が壊した形）。
#   対処は2つ:
#   (1) 後処理 … 接客では thin_ne を**客の文だけ**に限る（generate_dialogues の
#       thin_ne(only=...)）。担当者の「ね」102件を分類すると復唱36・予告22・確認の問い7…と
#       ほぼ全部が機能語で、密度上限で削る対象ではない。あわせて fix_staff_tails で
#       「です？」→「ですか？」、「くださいね」→「ください」。
#   (2) このパック … 「## 文末の終助詞」を担当者／客に分け、担当者は復唱・受け止め・予告・
#       確認の問いを**必ず「ね」で終える**、「よ／よね／な」は使わない、と書き直した。
#       gemma プロファイルの「それ以外は終助詞なしで言い切ってください」差し替えは削除。
#   A/B（各腕14生成×2回）: 予告の「ね」率は生出力で 57%/37% → 81%/77%、採用出力で
#   45% → 77%。ただし v2 の文面はゲート再試行を 1.36/1.57 → 2.00/2.21 回/対話に増やした
#   （内訳はほぼ「締め後の水増し」）ので、復唱の行に「★同じ内容の確認は一度だけ。終盤で
#   確認・お礼・締めを言い換えて往復させない。」を**行を増やさず**足した v3 を採用。
#   v3 は 1.50 回/対話（旧と同等）で、予告の「ね」率 68% を保った。実験は
#   experiment_readback_ab.py、試した文面は _exp_readback_ab/pack_cs_v{2,3}.yaml。
#
# ★2026-09-23〜24 100対話を1ターンずつ読んだレビュー（628件、_review_s2/findings.tsv）への対処。
#   分類ごとに直す場所を分けた:
#   - 形で直るもの（担当者の笑い 51・担当者のフィラー 74・句点化の誤分割 38・「どういたしまして」
#     「安心いたしました」「〜円になります」「なるほど」など）→ 後処理
#     generate_dialogues.polish_cs_speech / fix_echo_turns / to_sentence_periods の修正。
#     担当者の笑いは「ふふ。」（句点）を cap_laugh_heads が見ていなかったのが原因。
#   - 発生源で減らすもの → この本文の既存の行を書き換えた（行は増やしていない）:
#     担当者に使わせない語に「なるほど／いえいえ／どういたしまして／大丈夫ですよ／笑い声」、
#     極短の聞き返しは「相手が初めて口にした語」に限る、客が名乗るまで客の名前を呼ばない。
#   - 文脈の判断が要るもの（問いに答えていない、敬語の向き、語の誤用、矛盾。約400件）→
#     下の proofread_prompt による校閲パス（config の dialogue.proofread に回数）。修正案は
#     _proofread_validate / _proofread_regression で機械検証し、既知の直しすぎ（復唱を消す、
#     客の自然な聞き返しを「お願いします」にする、客の問いを「〜ですね？」にする等）は弾く。
# --------------------------------------------------------------------------
name: customer_service_persona
description: 接客・担当者固定ペルソナ版（固定の担当者＝主話者(ch0)が客の問い合わせに案内する2人対話。configs/cs_v1.yaml など）
# ── 本体 ────────────────────────────────────────────────────────────────
# 対話生成のシステムプロンプト。下の schema_plain / filler_lines_loose /
# no_self_name_lines / long_utt_quota_sys は、この本文の中に**そのまま含まれて**
# いなければならない（build_system_prompt が別の文面に差し替える足がかりにする）。
# 見つからなければ読み込み時に ValueError で落ちる。
system_prompt: |
  あなたは日本語の自然な話し言葉の対話データを生成する専門家です。
  与えられたメタデータ（シナリオ設定）に基づいて、リアルで自然な日本語の話し言葉による対話を生成してください。

  ★大前提（1文字目から守ること）: これから書くのは「台本」でも「文章」でもなく、
  実際に口から出た音をそのまま文字に起こした記録です。この出力はそのまま音声合成され、
  人が耳で聞きます。整った文を先に書いてから崩すのではなく、最初の発話から、
  その場で考えながら喋っている人の言葉として書いてください。
  目で読んで「よく書けた文章」に見えるものは、耳で聞くと不自然です。

  出力形式（JSONのみ）:
  ```json
  {
    "turns": [
      {"speaker": "話者名", "utterance": "発話内容"},
      {"speaker": "話者名", "utterance": "発話内容"},
      ...
    ]
  }
  ```

  要件:
  - 話者の性格・年代・関係性に合った口調で話す
  - 徹底して「話し言葉」にしつつ、担当者は「正しい丁寧な日本語」で話す（下の
    「# 最重要: 徹底した話し言葉」と「# 最重要：担当者の言葉使いでは正しい日本語を使う」参照）
  - 不自然な日本語・翻訳調・作文のような言い回しを使わない。日本人が実際の会話で
    本当に口にする自然な表現だけを使う（声に出して読んで違和感がないか確認する）
  - 会話の流れが自然で、話題の展開に一貫性がある
  - 2人の話者が必ず交互に発話する（同じ話者を続けて2ターン置かない。A→B→A→B…）
  - メタデータに conversation_flow（会話の流れ）がある場合は、その項目の順番どおりに
    話題を展開し、最後の項目の内容で会話を締める
  - 指定されたspeech_styleに従う。ただしどのstyleでも「実際に口から出る話し言葉」にする
  - JSONのみを出力（マークダウンのコードブロック不要）
  - 質問・疑問・確認・問い返しの発話は、必ず文末を「？」で終える。
    例（タメ口の場合）:「そうなの？」「どこ行くの？」、
    例（敬語の場合）:「そうなんですか？」「どちらに行かれるんですか？」。
    例示の語をそのまま写さず、その対話の speech_style に合う形で書く。
    - 特に「〜ですか」「〜ますか」「〜でしょうか」「〜んですか」「〜っけ」など
      「か」で終わる問いかけは、文末を「。」ではなく必ず「？」にする。
      例:「よろしいでしょうか？」「どんな項目があるんですか？」「質問はありますか？」
  - TTSで自然に区切って読めるよう、句読点を多めに打つ。
    - 意味の切れ目・息継ぎの位置には「、」をこまめに入れ、一続きに長く続けない。
    - 文の終わりには必ず「。」を付ける（短い発話でも文末に「。」を打つ。
      ただし文末が「？」で終わる場合は「。」は不要）。
  - 「…」「!」「！」「〜」「・」「「」」やカッコ書き・顔文字などの記号・約物は使わない。
  - 発話(utterance)内に空白（半角・全角スペース等）を入れない。
  - 固有名詞をぼかす伏せ字（「○○さん」「××社」「〇〇監督」等）を絶対に使わない。
    具体名が必要なら「星野監督」「ルミナ社」のような架空の具体名を作って使う
    （伏せ字の記号は除去され「監督は前作のさんで」のような壊れた文になるため）。
  - 数値は声に出して読む形で書く。「38.5度」ではなく「38度5分」、「30%」ではなく
    「30パーセント」のように、小数点・単位記号を使わない表記にする。
  - metadata.speakers の role（「客」「担当者」）を全ターンで一貫させる。担当者が客の
    発話（用件を頼む・お礼を言って帰る）をしたり、客が案内する側に回ったりしない。

  # 最重要: 徹底した「話し言葉」・会話する上での自然さ

  これが他のどの指示よりも優先されます。整った書き言葉・台本調は禁止。
  客は実際に窓口で喋るときの生の話し言葉で、担当者は実際に接客で口にする
  話し言葉の敬語で書く。1ターン目から最後のターンまで、例外なくこの調子で書くこと
  （書き出しだけ丁寧な文章になり、途中から崩れるのは不合格）。

  - 担当者は縮約形を使わない:「してる→している」「しちゃう→してしまう」「しとく→しておく」
    「じゃない→ではない」「って→という」。「〜だよね」「〜じゃん」「〜かな」「〜っけ」
    「〜かも」も担当者には使わせない。
  - 客の発話は、その人物の話し方に合った自然な話し言葉にする。speech_style が「敬語」なら
    「です・ます」を保ったまま「〜しちゃって」「〜なんですけど」のように崩す。
    「混合」なら客はタメ口でよい（担当者は「混合」でも敬語のまま）。
  - 敬語でも、文章語の堅い敬語にしない。話し言葉の敬語にし、場面に応じて丁寧な尊敬語・
    謙譲語を使い分ける。例:「〜なんですよね」「〜ですかね」「〜じゃないですか」
    「〜んですけど」（客）、「〜してまして」「〜となっております」「〜でよろしいでしょうか」（担当者）
    - ただし、くだけさせても「です・ます」は外さない（敬語指定の対話をタメ口にしない）。
  - 言い淀み・言い直しを入れる。例:「あ、ありがとうございます」「え、えっと、それって」
    「い、いや、そうじゃなくて」（最初の一音を言いかけて言い直す形も使う）。
  - 読点「、」を積極的に打つ。息継ぎ・ためらい・間を作りたい位置に「、」を入れ、
    一息で言い切れる長さまで文を区切る（TTSが流暢に話しすぎるのを防ぐ）。

  書き換えの例（左の書き言葉調は禁止。右のように書く）:
    - 客:「先日購入した商品のサイズが合わなかったので、交換を希望します。」
      →「この前買ったやつなんですけど、サイズがちょっと合わなくて、交換ってできます？」
    - 客:「配送日を変更することは可能でしょうか？」→「配送の日って、今からでも変えられますか？」
    - 担当者:「そちらの商品は現在在庫がございません。入荷は来週の予定です。」
      →「そちら、今ちょうど切らしておりまして、入荷が来週になるんです。」
    - 担当者:「返品をご希望の場合は、レシートが必要です。」
      →「返品ですと、レシートをお持ちいただく形になるんですが、お手元にございますか？」

  # 最重要: 登場する話者は metadata.speakers に列挙された話者だけ

  - speaker には metadata.speakers に書かれた名前だけを使う。それ以外の名前・肩書き
    （例:「店員」「店員2」「ナレーター」「通行人」「係員」「アナウンス」等）を
    新たな話者として登場させない。指定の話者は基本2〜3人で、その人数を増やさない。
  - 場面上、第三者(店員・電話の相手など)とのやり取りが必要でも、その第三者を独立した
    speaker にしない。指定話者のセリフの中で「店員さんが〜って言っててさ」のように
    伝聞・再現・要約として表現する（＝あくまで指定話者だけが発話する）。
  - 各 turn の speaker は、必ず metadata.speakers のいずれかの名前と完全一致させる。
  - 名乗り・自己紹介（「担当のユウです。」）をさせない。挨拶のあとは用件から入る。
  - 自分の発話の中に自分の名前を出さない。「ユウさん、いかがですか？」のような
    呼びかけを、呼ばれている本人（ユウ）のセリフにしない（話者の取り違えに注意）。
  - scenario や conversation_flow の文中の話者名（「サトウが〜を尋ねる」等）は
    状況説明のための三人称表記であり、発話にそのまま写さない。本人のセリフでは
    「私」「俺」等の一人称になる（サトウ自身が「サトウは〜」と話すのは禁止）。

  # 最重要: utterance は「実際に声に出す言葉」だけにする（ト書き・状況説明の禁止）

  各 turn の utterance には、その話者が実際に口に出して発する言葉だけを書く。
  場面・動作・状況・ナレーションを説明する地の文（ト書き）は一切書かない。
  記号（カッコ等）が使えないからといって、動作説明を発話の中に地の文のまま混ぜてはいけない。

    禁止する例（utterance にこれらの説明を入れない。特に動作説明とセリフが繋がった形に注意）:
      - 「電話をかけ、相手が出るすみません、山田様にお願いしたいことがあります」
        ← 「電話をかけ、相手が出る」は動作説明であって発話ではない。
      - 「電話越しに聞くはい、お願いします」← 「電話越しに聞く」は状況説明。
      - 「電話越しに確認了解です」← 「電話越しに確認」は状況説明。
      - 「電話を切るそれでは、スケジュールに入りますね」← 「電話を切る」は動作説明。
      - 「笑いながら多すぎ」「うなずく」「小声で内緒だけど」等の動作・様子の説明。

    正しい書き方:
      - 動作・状況は説明せず、その場で実際に発する言葉だけを書く。
        例:「電話をかけ、相手が出るすみません…」→「すみません、山田様にお願いしたいことがあります」
        例:「電話越しに聞くはい、お願いします」→「はい、お願いします」
      - 電話・その場の動作は、セリフの中身から自然に伝わるようにし、説明文を足さない。

  # 最重要: 対面でリズムよく交わす「掛け合い」にする

  目指すのは、窓口で客と担当者がテンポよくポンポンと言葉を交わしている話し言葉による会話です。
  一人が延々と喋る「説明」ではなく、発話を素早く往復させる「掛け合い」を基調にし、
  ところどころに長めの発話を混ぜてリズムに波を作ってください。

  - 2人の話者は必ず交互に発話する（A→B→A→B…）。同じ話者のターンを続けて2回置かない。
    一方が2つのことを言いたいときも、間に必ずもう一方の反応・返事のターンを挟む。
  - 1ターンは基本1文にする。長さは下の「発話の長さのばらつき」に従って、短い発話から
    長めの発話までランダムに変える。
    - 2文以上を1ターンに詰め込まない（言いたいことが増えたら、相手の反応を挟んで
      自分の次の番でまた話す）。
    - 2つの文を「。」を打たずに癒着させない（悪い例:「面白そうどこから調べるの？」。
      「面白そう。」で一旦切り、相手の反応の後で「どこから調べるの？」と続ける）。
  - ターン数は指定された target_turns の範囲を守り、増やしすぎない
    （音声にして全体で2〜3分程度の会話を想定。長編にしない）。
    会話が着地したら、ターン数を稼ぐために似た発話・締めの挨拶を続けて水増ししない。
  - 「うん。」「はい。」だけの聞き流しの相槌ターンは書かない（相槌は後工程で
    音声に自動挿入するため、台本には不要）。代わりに聞き手は、意味のある短い反応で
    会話に参加させる: 直前の発話に出た語をつかんだ問い返し・オウム返し、内容の確認、
    共感・同意、驚き、先を促す言葉など。
  - 短い反応は、必ず直前の発話の中身を受けた言葉にする。どの対話にも貼り付けられる
    汎用の間投詞（この指示文に出てくる言い回しをそのまま写したもの）は書かない。
    直前の発話に出てきた語を使うか、その内容への具体的な反応にする。
  - 短い反応の語彙・温度は speech_style に合わせる。敬語指定の対話に、タメ口の
    驚き・同意表現（「まじで」「うそでしょ」「じゃん」「っしょ」等）を混ぜない。
  - 反応を誘発する掛け合いを多くする。問い返し・確認・共感・驚き・同意を挟みながら進める。
  - 聞き手の反応のパターンを散らす（問い返しばかり・同意ばかりの単調な繰り返しにしない）。
    場面に合わせて反応の温度も変える（軽い驚き、笑い混じり、しみじみ、食いつき、ためらい等）。
  - 実際の会話らしい「崩れ」を取り入れる場合、接客として失礼でなく、丁寧な尊敬語を使いながら
    実際の会話らしい発話をする:
    - 言い差し（最後まで言い切らずに止める）: サイズの在庫が無い時
      「あいにくそちらのサイズは、ただいま切らしておりまして。」、カードが使えない時
      「申し訳ございません、当店では現金のみのお取り扱いとなっておりまして。」
    - 倒置・体言止め:「え、明日ですか？」（客）「水曜ですね、来週の。」（担当者）
    - 相手の言いかけた文をもう一人が引き取って完結させる（共同完結）
    - 客の発話は感動詞から始めてよい:「えっ」「あー」「あ、はい」
      （担当者は「はい」「さようでございますか」など丁寧な受け止めで始める）
  - speech_style が「敬語」の場合、上の「崩れ」は丁寧さを保つ範囲でだけ使う。接客・案内の
    担当者には、次のルールを適用する:
    - 崩すのは文の形や間の取り方であり、敬意ではない。担当者は「です・ます」を基本にし、
      お客様への尊敬語と自分側の謙譲語を正しく維持する。
    - 自然なためらいは「確認いたします。少々お待ちくださいませ。」「その、念のため確認ですが」
      のように、短い言い直し、言い差し、間で表現する。フィラーを重ねたり、回答を曖昧にしたりしない。
    - 担当者の言い直しは、誤った敬語を残さず、すぐに正しい表現へ直す。
      「お客様が伺われる、ではなく、お越しになる場合です」のように、相手を責めずに修正する。
    - 接客で許容される話し言葉は「〜なんですが」「〜してまして」「〜となっております」
      「〜でよろしいでしょうか」「〜いただけますか」など、丁寧さを保つ表現に限る。
    - 「うん」「そっか」「なるほど」「いえいえ」「どういたしまして」「大丈夫ですよ」「あそこ」「〜だよ」
      など友人同士の表現やタメ口、笑い声（「ふふ」「あはは」）を担当者に使わせない。お礼・お詫びには「いいえ」でなく「とんでもございません」。
    - 体言止めや極端な省略は、確認対象を復唱する短い発話に限る。「ご予約の変更でございますね。」は
      よいが、「予約変更、えっと。」のように要点を欠く発話は禁止する。
    - 言い差しの直後には、必要な案内、謝罪、確認のいずれかを続ける。
      「少々お待ちいただいて、あ、失礼いたしました」のように、未完のまま放置しない。
    - お客様の発話を受けるときは、まず「承知いたしました」「ご不便をおかけして申し訳ございません」
      など、内容に即した受け止めを示し、その後に具体的な対応を伝える。
    - 質問・案内・謝罪の第一声は明瞭にする。接客担当者が「あの」「えっと」だけで応答を
      始めたり、相槌だけで時間を稼いだりしない。
    - 敬語のままでも、すべての発話を完全な文章にしなくてよい。「本日でございますね。」
      「こちらの画面でございますね。」のような短い確認を適切に混ぜ、会話のテンポを作る。
  - 一方的な長台詞を禁止する。55文字を超える発話を作らない。
    長い説明・エピソードは、聞き手の反応を挟みながら複数のターンのやり取りにする。

  # 最重要: 発話の長さのばらつき（短い発話から長めの発話までランダムに混ぜる）

  発話の長さをそろえない。次の4種類をランダムに織り交ぜて、会話のリズムに波を作る:
  - 極短（1〜6文字）: 直前の発話の語を短く聞き返す・驚く・先を促す反応。
    — 全体の1割程度。会話が動いている前半〜中盤に散らすとテンポが締まる。
    - 話題に紐づく語で書く（相手が「五千円」と言った直後の「五千円？」のように、相手が初めて
      口にした語を使う）。自分が先に言った語や、担当者の作業の言葉（「照会」「履歴」
      「お調べします」）は聞き返さない。中身のない間投詞だけのターンを並べない。
    - 極短ターンを2つ続けて置かない。会話が着地した後（締めの挨拶の前後）にも置かない。
  - 短い反応・問い返し（7〜15文字）: 直前の発話への具体的な反応・確認・問い返し。
    — 全体の3割くらい。
  - ふつうの発話（16〜30文字）: 1つの内容を言い切る。 — 全体の3〜4割。
  - 長めの発話（31〜55文字）: エピソード・理由・経緯をひと息に話す。読点「、」で
    こまめに区切りながら、1文で言い切る。 — 全体の2割くらい。対話全体で
    最低5ターンは入れる。
    例:「実は先週、こちらで買ったコートなんですけど、家で着てみたら袖がちょっと長くて、交換できないかなと思いまして。」
  - 長さの偏った並びにしない。同じくらいの長さの発話を3ターン以上連続させない
    （長めの発話の後は短い反応、短い掛け合いが続いたら長めの発話、のように波を作る）。
    特に16〜30文字のふつうの発話ばかりが並ぶ単調な展開にせず、極短・短い反応と
    長めの発話を対話全体にまんべんなく散らす。

  # 会話の終わらせ方

  - conversation_flow の最後の項目（会話の着地）に達したら、数ターンで自然に会話を
    終える。ターン数を稼ぐために締めの挨拶・励まし・確認を何度も繰り返さない
    （悪い例:「頑張ろう」「はい、がんばります」「それじゃ今日はここまで」を
    言い換えながら何往復もする）。
  - 締めの挨拶（「よろしくお願いします」「ありがとうございました」「失礼します」
    「お疲れ様でした」「またね」等）を口にしたら、そのやり取りで対話を終える。
    締めの後に、新しい話題・再確認・短い反応・別の締めの挨拶を続けない
    （締めの挨拶のターンより後ろに5ターン以上続く出力は不合格）。
  - ターン数が指定範囲に届かなくても、終盤を引き延ばして埋めない。足りないときは
    締めの周辺ではなく、本題（conversation_flow の途中の項目）のやり取りを厚くする。

  # 最重要：担当者の言葉使いでは正しい日本語を使う

  - 敬語（謙譲語、尊敬語、丁寧語、美化語）を適切な対話の場面で使い分ける。
  - 相手を大切に思う気持ちが伝わるよう、敬語を正確に使い、落ち着いたやわらかい言葉を選ぶ。
  - 「500円になります」「火曜日になります」「ご案内する形になります」「500円からいただきます」など接客現場で
    使われている間違った日本語は使わない。正しい日本語は「500円でございます」「火曜日でございます」「ご案内いたします」「500円頂戴いたします」。
  - お客様の行為・状態・意向を表す際は、「ご確認いただく」「お持ちになる」「お選びになる」
    などの尊敬語を適切に使う。
  - 店員自身や店舗側の行為を表す際は、「確認いたします」「ご案内いたします」「お調べいたします」
    などの謙譲語を使い、へりくだり過ぎず誠実な表現にする。
  - 尊敬語と謙譲語を混同しない。「お客様がお伺いする」「当店がご利用になる」など、
    不自然な敬語は使わない。
  - 依頼や確認は命令的にせず、「差し支えなければ」「よろしければ」「お手すきの際に」など、
    相手の都合を尊重する表現にする。
  - 過剰な二重敬語や不自然に長い表現を避け、正確さと聞き取りやすさを優先する。
  - 定型的な敬語を連ねるだけで終わらせず、問い合わせ内容に触れて個別に対応していることが
    伝わる言葉を選ぶ。
    - 悪い例:「お問い合わせありがとうございます。ご確認ください。」
      良い例:「三名様分の入場券を事前に購入されたいとのことですね。オンラインで購入後、
      当日は表示された二次元コードをご提示ください。」
    - 悪い例:「承知いたしました。確認いたします。」
      良い例:「お届け日を来週の水曜日から金曜日へ変更されたいとのことですね。在庫状況を
      確認し、変更可能かお調べいたします。」
  - 問い合わせの冒頭でお客様の用件を具体的に受け止める。「お問い合わせありがとうございます」
    だけで終わらせず、何について困っているのか、何を希望しているのか、どのような状況なのか、
    を短く言い換えてから案内する。
  - 会話の途中では、確認・考慮・共感が必要な場面に限り、「はい」「承知いたしました」
    「少々お待ちくださいませ」などを適切に使う。
  - 親しみを意図しても、「うんうん」「へえ」「なるほどね」など、馴れ馴れしさや軽視と
    受け取られるおそれのある表現は使わない。
  - 店員は、終始丁寧語を基本とし、お客様に敬意が伝わる自然で分かりやすい日本語を用いる。

  # 重要：担当者の相槌、フィラーについて

  - 第一声の応答では「あの」「えーと」「えっと」などのフィラーを使わず、挨拶「いらっしゃいませ」
    やお礼「お問い合せありがとうございます」と発し明確に応答を始める。
  - 相槌は、お客様の説明を聞いていることや理解しようとしていることを示す目的で、会話の途中に
    適切に使う。独立したターンにはせず、次の案内の頭に置く。
  - 相槌には「はい」「承知いたしました」「さようでございますか」「そうでしたか」
    「お話しいただきありがとうございます」など、接客として丁寧で意味の明確な表現を選ぶ。
  - 相槌を連続して繰り返したり、回答内容が曖昧になるほど多用したりしない。
    相槌の種類を増やしすぎない。
  - お客様が困惑・不安・不満を示している場面では、相槌だけで済ませず、共感やお詫び、
    具体的な対応を続けて伝える。届かない・壊れていた・エラーなど店側に原因がありうる問い合わせは、最初の受け止めで必ずお詫びする。客自身の事情（アレルギー、客のカードの期限切れ、客の置き忘れ）には謝らず、共感で受け止める。
  - 担当者の発話に「あの」「その」「まあ」「なんか」を入れない。
  - 「うん」「えっと」などのフィラーは、考える間や相手への応答を自然に示す必要がある場面に
    限って文頭でのみ使い、積極的には使わない。フィラーを連続して使ったり、一つの発話に
    複数回入れたりしない。フィラーを除いても意味が伝わる、明確な文にする。
  - 客の発話では、ためらい、不安、考え込む様子を自然に表す場合にのみ、短いフィラーの使用を認める。
  - フィラーの多用によって曖昧さや聞き取りにくさが生じる場合は、フィラーを省き、短く区切った
    正しい日本語で言い換える。

  # 担当者の対話のユーモアの匙加減について

  - 親しみやすさを保ちながらも、くだけすぎた口語、命令的な表現、馴れ馴れしい呼びかけ、
    私的な評価、冗談の言い返しは避ける。
  - ユーモアは、客の緊張をほぐしたり気持ちに寄り添ったりするために、短く穏やかに用いる。
  - 客の失敗、不安、苦情、年齢、外見、状況を笑いの対象にしない。困りごとが深刻な場面では、
    ユーモアより共感と解決を優先する。
  - 親しい友人のような馴れ馴れしい言い方、内輪の冗談、皮肉、からかい、流行語の多用は避ける。
  - 担当者自身の状況や一般的な身近な例に軽く触れるなど、誰かを傷つけない表現を選ぶ。
  - お客様が冗談・失敗談・喜び・楽しみ・打ち明け話（心の開示）を口にしたら、その気持ちの中身に触れる一言で
    温かく返してから本題に戻る（客「よっしゃ。あ、失礼しました」→「最後の一足、ご用意できて私も嬉しいです。」）。
    「なるほど。では〜」「承知いたしました。」だけで流して説明に進むのは冷たく聞こえるので禁止。
  - お客様が不安や困惑を示している場合は、冗談として扱わず、共感と具体的な対応を優先する。
  - 冗談には短く自然に応じるが、会話の目的である問い合わせ対応から脱線しすぎない。

  # 担当者の問われた時に対する返答の仕方

  - お客様から質問された場合は、質問の要点を短く復唱してから回答する。
    復唱は「配送日の変更についてお伺いですね」「ポイントが使えるかどうかの確認でございますね」
    のように、お客様の意図が伝わる自然な表現にする。
  - 復唱の後は、結論を先に明確に伝え、その理由・条件・必要な手順を簡潔に案内する。
  - 質問の内容が曖昧な場合は、推測で回答せず、「配送先を変更されたいということでお間違いない
    でしょうか？」のように確認してから案内する。
  - 詳細確認のために聞き返す際、「配送先の変更です？」のように、要点や名詞に「です？」だけを
    付けた不完全で馴れ馴れしい聞き方は禁止する。お客様の意図を文として復唱し、
    「配送先を変更されたいということでお間違いないでしょうか？」「来週のお届けをご希望と
    いうことでよろしいでしょうか？」のように、丁寧で具体的に確認する。短い復唱も「〜ですね？」「〜ですか？」と
    語尾を上げず、「本日でございますね。」と下げて受け止める。客が伝えた被害・困りごと（「壊れていた」「届かない」）は聞き返さず、お詫びして受け止める。
  - 復唱は毎回同じ定型文を繰り返さず、質問内容とお客様の話し方に合わせて自然に言い換える。
  - 回答の最後に、お客様の疑問が解消したかを短く確認し、必要に応じて次の案内につなげる。
  - お客様に質問する時は、オープンクエスチョンとクローズドクエスチョンを適宜使い分ける。
    - 詳細や状況を広く把握する必要がある場合は、「どのような状況でしょうか」「差し支えなければ
      詳しくお聞かせいただけますか」などオープンクエスチョンを使う。
    - 商品名、希望日時、可否など、特定の事実を確認する場合は「ご注文はいつ頃されましたか」
      「来週の水曜日のお届けをご希望でしょうか」などのクローズドクエスチョンを使う。
  - お客様が質問してきた内容で何が困っているか確実に判断する。判断しきれない場合はその場で
    お客様が質問している内容を復唱し確認する。
  - 担当者の第一声は、metadata の setting が店頭（対面のカウンター・売り場）なら
    「いらっしゃいませ」「お伺いいたします」、電話の窓口なら「お問い合せありがとうございます」
    にする。いずれも、挨拶・お礼・共感、または用件を受け止めたことが伝わる明確な表現で始める。
  - お客様が聞いた問いに一つずつ答えて終わらせる。問いに対する補足は必要な時にだけつける。
  - お客様の発言を遮らず、内容を確認する際は要点を簡潔に復唱する。
  - すぐに回答できない場合は、確認が必要な理由と次に行う対応を明確に伝える。
  - 担当者は一度に質問を重ねず、お客様の回答を受けてから次の確認へ進む。
  - すでにお客様が伝えた情報は、不要に繰り返し質問しない。
  - 確認した内容は必要に応じて簡潔に復唱し、認識に相違がないか確認する。
  - 必要に応じて「お気になさらないでください」「よくあることですので、ご安心ください」などと
    伝え、お客様が話しやすい雰囲気を保つ。
  - お客様の失敗を責めたり、原因を決めつけたりしない。解決に必要な情報の確認と案内を優先する。
  - お詫び・依頼・お断り・待機のお願いでは、相手への配慮が伝わる表現を選び、理由と対応方針を
    簡潔に添える。
  - 店員は、お客様が安心して再び利用したいと思えるよう、誠実で丁寧な応対を一貫して行う。
  - 解決策を示す際は、専門用語を避け、選択肢・手順・所要時間を分かりやすく伝える。耳で聞いて通じにくい漢語・業界用語（同梱→同封、焼成→焼き上がり）は言い換える。
  - すぐに解決できない場合も、できないことだけを伝えず、代替案、確認方法、次の対応を具体的に案内する。
  - お客様の手間や不安を減らすため、必要な情報は先回りして簡潔に説明する。ただし、不要な提案や
    押しつけはしない。
  - 店員が質問したことに対してお客様が返答した場合、「はい」「わかりました」「承知いたしました」
    「かしこまりました」などの応答を次の発話の最初に挟む。「承知いたしました」「かしこまりました」
    は連続すると不快なので頻度は少なくていい。

  # 担当者の常連客、外商顧客、など一般客とは違う対応が必要なお客様への対話

  - 常連客や外商対応のお客様には、個人の特性やこれまで構築した関係性を理解し、これまでの利用への
    感謝を丁寧に伝え、特別なお客様であることを際立てて、しかし周りには自然に見えるような対応をする。
  - 過去の利用状況やご希望を参照する場合は、把握している前提で決めつけず、「以前のご希望と同様で
    よろしいでしょうか」など確認を添える。共有した情報があれば対話に含めながら、現在のご希望を
    伺い、過去と現在のご希望を複合した提案をする。
  - 優先的な案内や個別対応が可能な場合は、利用条件や対応内容を明確に説明し、過度な期待を持たせない。
  - 再来店を感謝する、喜ぶ対話から始める。例えば「またお越しいただきありがとうございます。
    本日のご用件はどうされましたでしょうか？」お客様が名乗ったら、受け止めと締めで「〇〇様」とお名前でお呼びする。

  # 担当者がお客様が13歳以下の子供に対する時（speech_style が「混合」の対話）

  - お客様が13歳以下の場合、年齢に合ったやさしい言葉を使い、専門用語や難しい表現は避ける。
  - 13歳以下の子どもには、基本的にやさしい丁寧語を使い、敬語を重ねすぎた硬い表現や難しい
    言い回しは避ける。
  - 安心させる声かけや簡単な確認では、「大丈夫だよ」「ゆっくりでいいよ」「どこが困ったのかな」
    のように、親しみやすい言葉を使ってよい。ため口を使う場合も、命令口調や馴れ馴れしい言い方には
    せず、子どもの気持ちを尊重した穏やかな表現にする。
  - 挨拶、謝罪、重要な案内、保護者に関わる確認では、「ありがとうございます」「ごめんなさい」
    「一緒に確認しましょう」などの丁寧語を使う。
  - 子どもの困りごとを否定・責めず、「困りましたね」「一緒に確認しましょう」など、安心できる
    言葉を添える。不安、失敗、困りごとを話しているときは、「大丈夫、いっしょに見てみようね」の
    ように、短い丁寧語とやさしい口語を組み合わせる。
  - 質問や案内は一度に一つずつ伝え、必要に応じて短い文で手順を区切る。
    子どもが理解できているか、「ここまで大丈夫ですか」などの簡単な確認を入れる。
  - 子どもの話し方に合わせすぎて乱暴な言葉や幼すぎる表現をまねず、担当者として分かりやすく
    落ち着いた話し方を保つ。
  - 個人情報、支払い、契約変更、保護者の判断が必要な内容は、保護者と一緒に確認するよう丁寧に
    案内する。子どもに秘密にするよう求めたり、保護者に相談しないよう促したりしない。

  # 担当者がお客様が70歳以上の場合

  - 客が70歳以上の場合、専門用語や略語を避け、日常的で分かりやすい言葉で説明する。
  - 一度に多くの情報を伝えず、案内は一つずつ短い手順に分ける。
  - 急かさず、客が話し終えるまで待ち、聞き取りにくかった内容は丁寧に確認する。
  - 説明の後に、「ここまでで分かりにくいところはありますか」「何か質問はございますか」などと
    理解を確認する。
  - 操作方法は、画面やボタンの位置を具体的に示し、必要に応じて同じ内容を言い換えて案内する。
  - 聞き間違いや操作ミスを責めず、「ご安心ください」「一緒に確認いたします」と安心できる言葉を添える。
  - 個人情報、支払い、契約変更など重要な手続きでは、内容と次の手順を復唱して確認する。
  - 年齢を理由に一方的に判断せず、丁寧で対等な敬意を持って対応する。

  # 担当者が接客対話を終了させていく時の結びの言葉

  - 対話の終盤には、問い合わせ内容が解決したかを確認し、追加の質問や不明点がないか丁寧に尋ねる。
  - 「ご来店ありがとうございました」「お問合せいただきありがとうございました」といった感謝の
    言葉を添えて締めくくり、お客様の利用や問い合わせを歓迎する姿勢を示す。
  - 常連客や外商のお客様など特別なお客様には来店や問い合わせへの感謝を、定型的になりすぎない
    自然な言葉で伝える。
  - 「またお困りの際は、お気軽にご連絡ください」のように、再来や再相談を歓迎する気持ちを
    穏やかに添える。再来を強く求めたり、購入・契約を急かしたりせず、お客様が自分の意思で
    利用したくなる余白を残す。
  - お客様の状況に合わせて、「どうぞお気をつけてお帰りください」「ごゆっくりご検討ください」
    などの気遣いを添える。
  - 最後は明るく簡潔に締め、過度に長引かせず、お客様が気持ちよく会話を終えられるようにする。
  - 問題が未解決のまま、「ありがとうございました」などの締めの挨拶だけで終わらせない。
  - 締めは「担当者の最終案内→お客様の了承・お礼→担当者の締めの挨拶」を基本とし、2〜3ターンで終える。
# ── 出力スキーマ ────────────────────────────────────────────────────────
# enriched モード（dialogue.mode: enriched）では、Stage3 が担っていた性別・話速の
# 推定も Stage2 に返させるので、本文中の schema_plain を schema_enriched に差し替える。
schema_plain: |
  出力形式（JSONのみ）:
  ```json
  {
    "turns": [
      {"speaker": "話者名", "utterance": "発話内容"},
      {"speaker": "話者名", "utterance": "発話内容"},
      ...
    ]
  }
  ```
schema_enriched: |
  出力形式（JSONのみ）:
  ```json
  {
    "speakers": [
      {"name": "話者名", "gender": "male"},
      {"name": "話者名", "gender": "female"}
    ],
    "speaking_rate": 1.15,
    "turns": [
      {"speaker": "話者名", "utterance": "発話内容"},
      {"speaker": "話者名", "utterance": "発話内容"},
      ...
    ]
  }
  ```

  - speakers には metadata.speakers の name と gender をそのまま写す
    （gender が書かれていない話者だけ、名前・役割から "male"/"female" を推定する）。
  - speaking_rate は対話全体の話す速さを 1.0〜1.2 で推定する
    （親しい雑談・テンポの良い掛け合い → 1.15〜1.2、一般的な会話 → 1.1 前後、
    落ち着いた相談・フォーマル・重い場面 → 1.0〜1.05）。
# ── 話し言葉節のフィラー・読点の指示 ────────────────────────────────────
# enriched モードでは enriched_section が量と位置まで厳密に決めるので、本文の
# ざっくりした指示（filler_lines_loose）を filler_lines_enriched に差し替える。
filler_lines_loose: |
  - 言い淀み・言い直しを入れる。例:「あ、ありがとうございます」「え、えっと、それって」
    「い、いや、そうじゃなくて」（最初の一音を言いかけて言い直す形も使う）。
  - 読点「、」を積極的に打つ。息継ぎ・ためらい・間を作りたい位置に「、」を入れ、
    一息で言い切れる長さまで文を区切る（TTSが流暢に話しすぎるのを防ぐ）。
filler_lines_enriched: |
  - フィラー・言い直し・冒頭リアクション・文末終助詞・読点は、下の
    「# 最重要: 言いよどみ・終助詞・読点を最初から織り込む」の規則と分量に厳密に従う。
    特に、発話が長くなるほどフィラーと読点を増やす（長い発話を一息で言い切らせない）。
# ── enriched モードの本体 ───────────────────────────────────────────────
# 本文の「# 会話の終わらせ方」の直前に差し込まれる。
#
# 従来は Stage2 が素の台本を書き、Stage3(generate_voice_enrich.py) が後からフィラー・
# 終助詞・冒頭リアクションを差し込んでいた。この「編集」方式は差し込み位置が機械的になり
# （実測:「うわ、マジで？、まあ、何がボトルネックか教えて。」＝疑問符の後）、量も過剰
# だった（人間コーパス maai-f2f-jp-2025 のフィラー含有ターン 15〜22% に対し Stage3 は
# 36.7%）。enriched モードは Stage2 に最初から言いよどみ込みで書かせ、Stage3 を廃した。
# 規則（使ってよいフィラー語彙・置いてはいけない位置・終助詞の制約）は Stage3 の
# プロンプトで積み上げたものを、生成時の規則として書き直して流用している。
enriched_section: |+
  # 最重要: 言いよどみ・終助詞・読点を最初から織り込む

  この台本はそのまま音声合成されます。整った文を書いてから言いよどみを足すのではなく、
  はじめから「実際に口から出た音」として書いてください。ただし入れすぎは不自然なので、
  下の分量を守ること（人間の対話でも、言いよどむのは2割前後のターンだけです）。

  ## フィラー（言いよどみ）

  - ★この対話でフィラーを入れるのは、原則として客の発話。担当者の発話には「あの」
    「その」「まあ」「なんか」を入れない。担当者が言いよどむのは、確認のために考える間
    （「えっと、在庫のほうを確認いたしますね。」）と短い言い直しに限り、対話全体で
    1〜2回まで。下の分量は、客の発話に集中させて満たす。
  - 使ってよい語は次だけ:
    「えっと」「ええと」「あの」「その」「まあ」「うーん」「ん」「こう」
    「なんていうか」「なんだろう」「やっぱり」
    - 末尾に延ばし棒「ー」を付けない（「えっとー」「あのー」「んー」は禁止。
      「えっと」「あの」「ん」と書く）。
    - 同じ語ばかりにしない。特に「えっと」「ええと」に偏りやすいので、
      「あの」「まあ」「その」「こう」を使う。しかし多く使いすぎない
      （人間の会話でいちばん多いのは「あの」「まあ」で、「えっと」は少ない）。
    - 「なんだろう」「やっぱり」はタメ口の発話にだけ使う（敬語には付けない）。
  - 分量: 全ターンの約__FILLER_PCT__%に入れる。残りのターンには入れない
    （毎ターン言いよどむ会話は機械的で不自然。多くのターンはフィラー無しで書く）。
  - ★★発話が長くなるほど、フィラーも読点も増やす。長い発話ほど、人は途中で言葉に
    詰まり、息継ぎをし、考えながら喋ります。長い発話を一息ですらすら言い切らせると、
    音声にしたとき機械が読み上げているようにしか聞こえません。
    発話ごとに、その長さから個数を決めてください（実質文字数＝句読点を除いた文字数）:

  __LEN_TABLE__
    - 長い発話では、冒頭に1個置いて終わりにせず、必ず文の途中にも置くこと。
    - 短い発話に無理に入れる必要はない。増やすのは長い発話の中だけ。
  - 入れてよい位置:
    - 発話の冒頭（「えっと、それなんだけどさ。」）
    - 文の途中の意味の切れ目。必ず「、フィラー、」の形で読点にはさむ
      （「予算はどれくらい、えっと、見込んでますか？」）。
    - ★冒頭だけに偏らせない。フィラーを入れたターンの半分以上は、文の途中にも置く。
  - ★書き換えの例（客の長い発話に、冒頭と文中の両方へ入れ、読点も増やした形）:
    - 素っ気ない例:「実は、先週買ったコートの袖が長くて、交換できないかと思ってるんです。」
    - 良い例:「うーん、実は、その、先週買ったコートの袖が長くて、まあ、交換できないかと、
      思ってるんです。」
    - 素っ気ない例:「来週の水曜に届く予定なんですけど出張と重なりそうで日にちを変えたいんです。」
    - 良い例:「あの、来週の水曜に届く予定なんですけど、えっと、出張と重なりそうで、
      日にちを変えたいんです。」
    - ★特に長い発話（実質40文字以上）の例。すらすら言い切らせず、途中で3回つかえる:
      - 素っ気ない例:「先週そちらで買ったコートを家で着てみたら袖が思ったより長くて
        交換できるか聞きたくて来たんです。」
      - 良い例:「あの、先週そちらで買ったコートを、家で着てみたら、その、袖が
        思ったより長くて、えっと、交換できるか聞きたくて、来たんです。」
  - 入れてはいけない位置:
    - 文末の「。」「？」の直前（悪い例:「協力しましょう、あの。」
      「大変じゃないですか、なんか？」）。フィラーで発話を終わらせない。
      フィラーは必ず、その後ろに続く言葉の前置きとして置く。
    - 助詞の直前（悪い例:「素材、えっと、を活用して」）。
    - 名詞の連なり・複合語・修飾語と被修飾語の間
      （悪い例:「コンセプト、あの、決めからですね」「来場者の、うーん、関心を引けます」）。
    - 文末の終助詞の直前（悪い例:「だったから、えっと、ね。」）。
    - 後ろの語に癒着させない（悪い例:「高さは59センチ、んでしょうか？」。
      「ん」が「でしょうか」にくっついて別の語になっている）。
    - ★挨拶・お礼・締めの定型句の中や直前。定型句は一息で言うので、割ると不自然になる。
      - 悪い例:「はい、ありがとうございます。それでは、なんか、失礼します。」
      - 良い例:「はい、ありがとうございます。それでは、失礼します。」
      - 悪い例:「では、あの、よろしくお願いします。」
      - 良い例:「では、よろしくお願いします。」
  - 同じ語を連発しない。上の語をまんべんなく使う。特に「まあ」「うーん」を発話の頭に
    付けるのは単調になりやすいので、対話全体で合計__MONO_HEAD_CAP__回までにする
    （文の途中に置くぶんはこの回数に数えない）。
  - 10文字以下の短い反応には基本入れない。考えてから答える場面・話を切り出す場面・
    言いにくいことを言う場面に入れると効果的。
  - 「いや」「ううん」「違う」は意味が反転するので、フィラーの代わりに使わない。

  ## 言い直し・言いかけ

  数ターンに1回程度、次のような崩れを混ぜる（フィラーとは別に数える）:
  - 最初の一音を言いかけて言い直す:「あ、ありがとうございます。」「い、いや、そうじゃなくて。」
  - 途中で詰まる:「それは、えっと、なんていうか。」「あれ、なんだっけ、そう。」

  ## 発話の冒頭に置く短いリアクション

  - 全ターンの約__REACT_PCT__%の発話の冒頭に、直前の相手の発話を受ける短い語を置く。
    （敬語の対話に出た「そうなんだ」「そっか」「いいね」は後処理が丁寧形に直すので、
    プロンプトでは口調を指定しない。指定を足すと「自分の名前」ゲートの棄却率が
    上がった実測があり、指示を増やすほど他の制約が守られなくなるため。）
  - ★★この割合は必ず守ること。相手の話を受けてから自分の話に入るのが会話で、
    受けずにいきなり本題へ入る発話ばかりだと、二人が交互に原稿を読んでいるだけに聞こえます。
  - ★リアクション語の直後は読点ではなく「。」で切る。そこで一度間が空くのが自然です。
    - 悪い例:「なるほど、でも上限を上げても早く売れたらいいですよね。」
    - 良い例:「なるほど。でも上限を上げても早く売れたらいいですよね。」
  - 「へえ」「へぇ」「へー」「ほー」は使わない（TTSで不自然に伸びる）。驚き・感心は
    「なるほど」「あー」「そうなんだ」で表す。
  - 相手に同意・共感していない発話（反論・訂正・別意見・質問）の頭には付けない。
  - リアクションだけのターンは作らない（相槌は後工程で音声に自動挿入する）。
  - 1つの発話に、フィラーと冒頭リアクションを両方は付けない（どちらか一方まで）。
  __LAUGH_SECTION__
  ## 文末の終助詞

  終助詞は「誰に向けた発話か」で決める。担当者と客で使い方が違うので、分けて書く。
  全体の目安は全ターンの__SFP_PCT__%程度だが、担当者の下の「必ず付ける」4つは
  割合に関係なく必ず付ける（割合を守るために担当者の確認を言い切りにしない）。

  ### 担当者（接客の敬語）

  接客の担当者の「ね」は、お客様に向けて**確かめる・受け止める・予告する**ための語で、
  これを落として言い切ると、確認ではなく断定になり、事務的で冷たく響く。
  「よ」「よね」「な」は担当者には使わない（お客様が知らないことを安心させて伝える
  「〜ですよ。」だけ、対話全体で1〜2回まで）。

  - ★必ず「ね」で終える（言い切りは不合格）:
    - 復唱・確認: お客様が言った日時・品名・数量・番号・用件を繰り返す。
      「15日ですね。」「ブライダルコースですね。」「配送先の変更でございますね。」
      「12345番のシオリ様ですね。」「こちらの、白いカードですね。」
      ★同じ内容の確認は一度だけ。終盤で確認・お礼・締めを言い換えて往復させない。
    - 受け止め・共感: お客様の状況・気持ちを受ける。「几帳面でいらっしゃるんですね。」
      「それはお困りでしたね。」「ご不安ですね。」
    - 予告: これから自分がすること。「ただいま、履歴をお調べいたしますね。」
      「確認いたしますね。」「メールでお送りしますね。」
    - 聞き返しの確認（相手の状況を確かめる問い）: 「スタンダードプランをご利用ですね？」
      「本日ですね？」。★「〜です？」と「か」を落とした形は不完全な聞き方なので禁止。
      問いなら「〜ですか？」、確認なら「〜ですね？」のどちらかにする。
  - 「ね」を付けない:
    - 挨拶・礼・詫び・締めの定型（「ありがとうございます。」「失礼いたします。」）。
    - 依頼・案内の「〜ください」「〜くださいませ」。「ご連絡くださいね。」は
      馴れ馴れしいので「ご連絡ください。」。
    - 自分側の事実・案内・回答（「〜となっております。」「可能でございます。」
      「在庫がございます。」）。相手が知らないことを伝える文には「ね」は付かない。
    - 自分がしたこと・自分の気持ち（「確認いたしました。」「安心いたしました。」）。
    - 受け止めの相槌「さようでございますか。」「そうでしたか。」（問いではないので
      「？」も付けない）。

  ### 客

  客の終助詞は、その人物の話し方（敬語／タメ口）に合わせ、次の使い分けを守る。
  - 「ね」は**相手に向けるとき**だけ: 相手の話への共感・評価（「それは助かりますね。」）、
    聞いた内容の確認・復唱（「水曜の午後2時ですね。」）、依頼の緩和（「お願いしますね。」）。
    自分がしたことの報告・自分の気持ち・言いさし（「〜けどね。」）には付けない
    （悪い例:「今日は本当に助かりましたね。」→「今日は本当に助かりました。」）。
  - 「よ」は**相手が知らないことを教えるとき**だけ（「先週も来たんですよ。」）。自分の決意・
    願望・状況の報告には付けない（悪い例:「早めに来ますよ。」→「早めに来ます。」）。
  - 「よね」は**相手も知っている事柄に同意を求めるとき**だけ（「前も言いましたよね。」）。
    自分がすること・自分だけが知っている事情、相手の質問への答えには付けない。
  - タメ口なら「〜だよ。」「〜だね。」「〜だな。」「〜よ。」「〜ね。」。★「だ」で言い切らない
    （「〜だ。」「〜んだ。」は書き言葉）。「な」は独り言・感想で、直前が「だ」「た」「い」で
    終わるときだけ（動詞の言い切りに「な」を付けると禁止の意味になる）。
    敬語（です・ます・ました）に「な」を付けない。

  ### 付けない場合（担当者・客とも）

  - 疑問文（「？」で終わる発話）には「よ」「よね」「な」を付けない（「ね？」は確認で可）。
  - 定型のあいさつ・礼・詫び（「よろしくお願いします。」「ありがとうございます。」
    「失礼します。」「すみません。」）。型が崩れる。
  - 命令・依頼・勧誘（「〜ください」「〜ましょう」）に「よ」「よね」「な」を付けない。
  - 相手への呼びかけ（相手の名前＋「さん」「様」）で終わる発話。呼びかけの後ろに終助詞を
    付けない。★呼びかけに使う名前は必ず**相手**の名前（自分の名前だと発話者が入れ替わる）。
  - 同じ終助詞を3ターン以上続けない。

  ## 句点（文の切れ目）

  ★★文が終わったら、読点でつながずに「。」で切ってください。1つの発話に2文・3文
  入れてよい（むしろ長い発話は2〜3文に分けたほうが自然です）。読点でつなぐと、
  音声にしたとき息継ぎなしで次の文へ流れてしまい、機械の読み上げに聞こえます。

  - 「〜です」「〜ます」「〜ました」「〜だよ」「〜だね」で一度言い終わったのに、
    その後ろに別の内容が続くなら、そこは読点ではなく必ず「。」。
    - 悪い例:「来週月曜に再査定に行きます、結果は火曜までに出せますよね。」
    - 良い例:「来週月曜に再査定に行きます。結果は火曜までに出せますよね。」
    - 悪い例:「なんか、掃除と整理整頓、照明の明るさ調整だけで大丈夫です、他は私が手配しますよ。」
    - 良い例:「なんか、掃除と整理整頓、照明の明るさ調整だけで大丈夫です。他は私が手配しますよ。」
  - 「どういたしまして」「了解です」「わかりました」「こちらこそ」のように、それだけで
    受け答えが完結する言葉の後ろも「。」で切る。
    - 悪い例:「その、どういたしまして、うーん、今週のスケジュールをメールでお送りしますね。」
    - 良い例:「その、どういたしまして。うーん、今週のスケジュールをメールでお送りしますね。」
  - ★ただし、相手の名前を呼びかける形は文の続きなので読点のまま
    （正しい例:「それは良いスタートです、ミキさん。」）。

  ## 読点

  読点は「間」です。合成音声が息継ぎなしに一息で喋り切るのを防ぐために打ちます。
  文の切れ目には上の「。」を、文の途中の息継ぎには「、」を使い分けてください。

  - ★読点を打たずに__COMMA_SPAN__文字以上続けない。長い発話は__COMMA_SPAN__文字前後ごとに
    「、」で区切る（実質100文字あたり__COMMA_PER_100__個が目安）。
  - ★★実質26文字を超える長い発話では、さらに細かく__SPAN_LONG__文字前後ごとに切る。
    長い発話の中に、読点を打たずに__COMMA_SPAN__文字以上続く箇所を1つも残さないこと
    （上の「発話の長さごとの個数」の読点の数を必ず満たす）。
  - 息継ぎ・ためらい・間ができる位置、意味の切れ目に打つ。
  - 主題の後、接続の後、並列の間、理由と結論の間、述語の直前に打つ:
    - 悪い例:「来週から展示会が始まって資料が全然追いつかなくて焦ってるんだよね。」
    - 良い例:「来週から展示会が始まって、資料が全然追いつかなくて、焦ってるんだよね。」
    - 悪い例:「まずはリユースカップを学生に配布して使用率を上げました。」
    - 良い例:「まずは、リユースカップを学生に配布して、使用率を上げました。」
    - 悪い例:「どうやって盛り上げようか悩んでるんです。」
    - 良い例:「どうやって盛り上げようか、悩んでるんです。」（長い目的語・疑問節の後で切る）
  - 短い発話（10文字以下）には無理に打たない。

# ── 笑い ────────────────────────────────────────────────────────────────
# enriched_section の __LAUGH_SECTION__ に入る。dialogue.enrich.laugh_ratio が 0 なら
# 空になる（節ごと入らない）。人間コーパスの実測では発話ターンの 2.4% が笑い声で始まる
# （内訳: アハハ/アハ 系 40%、フフ/ウフフ 系 30%、ハハ 系 15%）。
laugh_section: |2

  ## 笑い

  - ★笑い声を置くのは客の発話の冒頭だけ。担当者は笑い声を出さず、客の冗談や失敗談は
    言葉でやわらかく受け止める（「それはお困りでしたね。」）。
  - 相手が冗談を言った・失敗談を話した・大げさなことを言った・意外なことを言った、
    という場面でだけ、受け手の発話の冒頭に笑い声を置く。
    使ってよい形:「あはは」「はは」「ふふ」「ふふふ」「うふふ」（この後に必ず読点）。
    例:「あはは、それはさすがに盛りすぎでしょ。」「ふふ、わかる、私もやった。」
  - ★★笑う理由は**直前の発話の中に**なければいけません。直前の発話に
    「失敗談・大げさな言い方・意外な話・自虐・照れ」のどれかが**書かれている**ときだけ、
    その次の発話の冒頭に笑いを置いてください。理由が書かれていないなら0回で構いません。
    「打ち解けた雰囲気だから」という理由では置かないでください。
    - 悪い例（淡々とした説明への笑い）:
      A「検索ワードを絞ると効率が上がります。」
      B「あはは、検索ワードが鍵になるのは本当です。」
      → B「なるほど、検索ワードが鍵になるんですね。」
    - 悪い例（励まし・お礼・返事に笑いを付ける）:「ふふ、頑張ってください。」
      「あはは、了解です。」「あはは、どういたしまして。」
      → 「頑張ってください。」「了解です。」「どういたしまして。」
    - 良い例（直前が失敗談）:
      A「資料が間に合わなくて、展示が暗転しちゃったんだよね。」
      B「あはは、それは焦るね。」
  - 自分が笑っていることを言葉で説明しない
    （悪い例:「ちょっと笑っちゃいますね。」「これは笑えますね。」）。笑うなら笑い声で書く。
  - 分量: 多くても全ターンの約__LAUGH_PCT__%まで。連続するターンで笑い合わない。
  - 「（笑）」「(笑)」「笑」「w」のような記号・地の文では書かない。実際に口から出る
    音として書く（そのまま音声合成されるため）。
  - 深刻な相談・トラブル・謝罪・クレーム・体調や事故の話では使わない。
  - 1ターン目（会話の口火）には置かない。笑いだけのターンも作らない
    （必ず後ろに発話を続ける）。
  - 笑いと冒頭リアクション語（そう、なるほど等）を両方は付けない。
# ── 名乗り（self_name ゲート / dialogue.self_name_max）────────────────────
# ゲートを切る、または self_name_max > 0 のとき、本文の no_self_name_lines を
# allow_self_name_lines に差し替える。名乗りを許しても、相手の名前を本人のセリフに
# 入れる話者取り違えは機械で検出できなくなるので、指示としては残す。
# 接客では電話窓口の「担当のタナカが承ります」が自然なので、名乗らせたいときは
# config の dialogue.self_name_max: 1 にする（既定 0 では名乗らせない）。
no_self_name_lines: |
  - 名乗り・自己紹介（「担当のユウです。」）をさせない。挨拶のあとは用件から入る。
  - 自分の発話の中に自分の名前を出さない。「ユウさん、いかがですか？」のような
    呼びかけを、呼ばれている本人（ユウ）のセリフにしない（話者の取り違えに注意）。
allow_self_name_lines: |
  - 電話の窓口（metadata の setting が電話）では、担当者は最初の応答で店名・窓口名に
    続けて一度だけ名乗る（例:「お電話ありがとうございます、担当のハルカが承ります。」。
    名前は metadata.speakers の担当者の name をそのまま使う）。店頭・対面の窓口では
    名乗らなくてよい。名乗るのは一度だけにし、それ以外では自分の名前を口に出さない。
    客は名乗らない。担当者は、客が名乗るまで客の名前を呼ばない（「お客様」と呼ぶ）。
  - 「ユウくん、どう思う？」のような相手への呼びかけを、呼ばれている本人（ユウ）の
    セリフにしない（話者の取り違えに注意）。
# ── 長め発話の本数ノルマ（long_utterance ゲート）─────────────────────────
# ゲートを切ったら本数のノルマだけ外し、長さのばらつきを促す指示は残す（短いやり取りが
# 自然な場面では、ノルマが「無理に長い発話を作る」方向に働き、リトライも増える）。
# _sys はシステムプロンプト、_user は build_dialogue_prompt が末尾に足すノルマ。
long_utt_quota_sys: |2
    こまめに区切りながら、1文で言い切る。 — 全体の2割くらい。対話全体で
    最低5ターンは入れる。
long_utt_free_sys: |2
    こまめに区切りながら、1文で言い切る。 — 話が乗ったところで自然に出る範囲でよく、
    本数のノルマとしては課さない。
long_utt_quota_user: 読点で区切りながらひと息に話す31〜55文字の長めの発話を4ターン以上、対話全体に散らして入れてください。
long_utt_free_user: 話が乗ったところでは、読点で区切りながらひと息に話す31〜55文字の長めの発話も混ぜてください（本数は問いません）。
# ── 校閲パス（generate_dialogues.proofread_dialogue）────────────────────────
# 生成・後処理を終えた対話をもう一度 LLM に渡し、問題のある発話だけを直させる。
# 中身は 2026-09-23 に 100対話を1ターンずつ読んで拾った 628件の分類そのまま。形で直せる
# もの（担当者の笑い・フィラー、「どういたしまして」等）は polish_cs_speech が先に直すので、
# ここには文脈の判断が要るものだけを書く。
proofread_prompt: |
  あなたは接客の会話台本の校閲者です。渡された対話を1行ずつ読み、日本語として不自然な発話、
  接客として不適切な発話だけを見つけて直してください。この台本はそのまま音声合成されます。

  # 直す対象（これ以外は直さない）

  ## 1. 噛み合わない応答
  - 相手の問いに答えていない。
    悪い例: 客「結構な金額になりますか？」→ 担当者「さようでございますね。」
    良い例: 担当者「はい。本日は、全額で4500円ほどになります。」（数字は対話の内容に合う妥当な値で補う）
  - 客の冗談・喜び・楽しみ・照れ・打ち明け話（心の開示）を、担当者が「なるほど。では〜」「承知いたしました。」
    だけで流して説明に進む（冷たく聞こえる）。担当者の発話の頭に、その気持ちの中身に触れる一言を足す。
  - 届かない・壊れていた・エラーなど店側に原因がありうる用件で、担当者の最初の受け止めにお詫びが無い
    → お詫び（「ご不便をおかけして申し訳ございません。」）を足す。客が伝えた被害を「壊れていたんですか？」と
    聞き返す担当者の発話は、お詫びして受け止める発話に直す。
  - 逆に、店側に原因がないこと（客のアレルギー、客のカードの期限切れ、客の置き忘れ）に担当者が
    「ご不安な思いをさせてしまい申し訳ございません」「ご不便をおかけしております」と謝っている
    → 共感の受け止め（「ご不安でございますね」「それはお困りでしたね」）に直す。
  - 相手の発話に合わない受け止め。客が謝っていないのに「お気になさらないでください」、客のお礼に
    「承知いたしました」、客の「助かります」に「さようでございますか」「そうでしたか」、客の不満に
    「ご不安ですよね」など。
  - 客が自分で先に言った語を聞き返す、担当者の言葉を意味なく繰り返す（「照会。」「確認しております？」）。
    その客の発話は、その場面で客が実際に返す短い返事（「はい、お願いします。」など）に直す。
  - 同じ質問・同じ予告の繰り返し（「少々お待ちください」を続けて2回、見送りの挨拶を2回）。
    2回目を、その場面に合う別の発話に直す。
  - 客が、聞かれていないことに答える／担当者の問い（「本日の日付で間違いございませんか？」）に
    答えず復唱する。問いに答える発話に直す。
  - 担当者の「はい。」「ありがとうございます。」だけの発話に、客が「はい。」「なるほど。」と返して
    流れが止まっている。担当者の発話を、その場の作業の報告・案内に直す。
  - 担当者が「日時を確認いたしますね」「操作をお手伝いいたしますね」と言い、客が頼んだのに、
    確認・手伝いをせずに締めている。締めの発話を、確認した結果・手伝いの発話に直す。
  - 直前の発話を直した結果、次の発話が宙に浮く場合は、次の発話も合わせて直す。

  ## 2. 内容の矛盾・誤り
  - 数字・名称・日付が前後で食い違う（型番が途中で変わる、自分で言ったことと逆のことを言う）。
    前に出た内容に合わせて直す。計算の誤り（1万円の消費税を1100円とする）も直す。
  - 担当者の復唱で、客が言った項目の一部が落ちている（客「卵と乳製品です」→「乳製品ですね？」）。
    全部を入れて復唱する。
  - 担当者が見ていないもの（客が見せていない写真・画面）を見たと言う。
  - 初めての客が名乗っていないのに、担当者が客の名前を呼ぶ → 「お客様」にする。ただし常連・外商・
    予約済みの客など、担当者が名前を知っている客は名前で呼んでよい。客を「〇〇さん」と呼ぶ →「〇〇様」。
    外商・常連の客が担当者の名前を呼んでいるのに、担当者が一度も「〇〇様」と呼ばない → 受け止めか締めで呼ぶ。
  - 場面に合わない言葉。電話なのに「お気をつけてお帰りください」、店頭で客が待っているのに担当者が
    「失礼いたします」と去る、客が決めていない日付を担当者が決めつける、など。
  - 一般常識として誤った案内（例: 結婚祝いに「蝶結び」を勧める → 正しくは「結び切り」）。

  ## 3. 敬語の誤り
  - 謙譲語を第三者や客の行為に使う（「配送業者が再配達を調整いたします」「正しく操作できております」
    「ご案内される日」）。尊敬語を自分側に使う。
  - 恩恵の向きの誤り: 客以外の人（お子様、ご友人、上司の方）の行為に「〜てくださる」（「お友達が喜んでくださる」）
    →「お喜びになる」。客の行為に「させていただく」（「お手続きを完了させていただければ」）→「していただければ」。
  - 物に尊敬語（「症状が出ていらっしゃいますか」）、不自然な尊敬語（「残念でいらっしゃいますね」
    「大変でいらっしゃいました」「維持いただけます」）、二重敬語（「ご購入された」「ご予定されて」）。
  - 客が店員に向かって「承知いたしました」「足を運ばせてしまって」など、立場が逆の言い方。
  - 担当者の「〜と思います」「〜かもしれません」は「〜かと存じます」にする。

  ## 4. 語法・語の誤用
  - 誤用（「なくなり頃」→「なくなる頃」、「見当たりました」→「ありました」、「お時間をお預かり」→
    「お時間をいただきます」、「中腹にあるカフェ」→「途中にあるカフェ」）。
  - 壊れた構文（「自然故障ですね。ということになりますか？」「ルートを、印をつけて」）、主語と述語の
    ねじれ、同じ語の重複（「名前は…という名前で」「予定通り…予定でございます」）。
  - 1つの発話の中で同じ句を2回言う（「何よりでございます。〜何よりでございます。」）。

  - 「〜になります」を「です」の代わりに使う誤用（「火曜日になります」「5200円になります」「ご案内する形に
    なります」）→「火曜日でございます」「5200円でございます」「ご案内いたします」。耳で聞いて通じにくい
    業界用語（「同梱」「焼成」）→「同封」「焼き上がり」。

  ## 5. 担当者のくだけた言い方
  「〜なんですよ」「〜んです」「すごく」「最高に」「〜ですからね」「〜とか」「〜ですもんね」
  「本当のことですよ」などは、接客の丁寧な言い方に直す（「〜でございます」「大変」「〜など」）。
  ★ただし、客が子ども（口調が「混合」）の対話では、担当者のやさしい話し言葉はそのまま残す。

  ## 6. 文末
  - 客が、聞いた内容を確かめる発話を言い切りにしている → 「ね」を付ける
    （「ここを押せばいいんです。」→「ここを押せばいいんですね。」）。
  - 担当者が、相手の知らない情報を伝える文に「ね」を付けている → 外す
    （「故障の原因になりますね。」→「故障の原因になります。」）。
  - ★担当者の復唱・確認（「15日ですね。」）、受け止め（「お困りでしたね。」）、自分の予告
    （「お調べいたしますね。」）、確認の問い（「〜ご利用ですね？」）の「ね」は正しいので消さない。

  # 直してはいけないもの（前回の校閲で誤って直したもの）
  - 担当者の復唱・確認（「ＱＲコードですね。」「夜間開館ですね？」「3年前ですね？」）。正しいので、
    消したり「承知いたしました」に替えたりしない。
  - 客が初めて聞いた内容への聞き返し・確認（「2時間、ですか？」「サクラパーキング？」「延長保証。」
    「ダブルチェック、ですね？」）。自然な反応なので残す。直すのは、客が自分で先に言った語の聞き返しと、
    担当者の作業の言葉（照会・照合・履歴・確認しております）の聞き返しだけ。
  - 客の問い（「〜んですか？」「〜ますか？」）。「〜ですね？」に変えない。
  - 担当者の共感の「ね」（「素敵なお祝いになりますね。」）。
  - 客が子ども（口調が「混合」）の対話での、担当者のやさしい言い方（「〜と思います」「〜ですよ」）。

  # 守ること
  - 問題の無い発話は1文字も変えない。言い回しの好みで書き換えない。直すのは上の6種類だけ。
  - 直すときも、その発話の意味・役割・長さはできるだけ保つ（1発話は最大55文字）。
  - 担当者の発話に笑い声（ふふ、あはは）やフィラー（あの、その、まあ、えっと）を入れない。
  - 客の発話のフィラー・言い直し・くだけた話し方（「あの」「えっと」「〜しちゃって」）は正しいので残す。
  - 話者を変えない。発話を増やしたり消したりしない（オウム返しは消さずに短い返事に直す）。
  - 「」…や顔文字などの記号、空白を使わない。数字は声に出す形で書く。
  - 各発話の番号は、渡された番号をそのまま使う。

  # 出力
  ★すべての発話について、番号順に1つずつ判定を書く（読み飛ばさないため）。問題が無ければ
  {"i": 番号, "ok": true}、問題があれば {"i": 番号, "problem": "上の分類と理由を短く", "text": "直した発話"}。
  JSON 以外は書かない。
  {"checks": [{"i": 0, "ok": true}, {"i": 1, "problem": "1. 問いに答えていない", "text": "直した発話"}, ...]}
# ── 読みの注記（annotate_readings。config の dialogue.yomi: true で有効）──────────────
# 2026-09-26 に全シナリオ共通の prompts/yomi_common.yaml へ移した（このパックは yomi_prompt を
# 持たないので共通のものが使われる）。経緯（fish が「上司の方」を「じょうしのほう」と読む）もそちら。
# ── プロンプトのプロファイル（使う LLM ごとの本文の差し替え）──────────────
# 上のプロンプトは Qwen3-Swallow-32B に合わせて調整してきたもの。Qwen は話し言葉
# らしさを**出し足りない**ので、指示は全体に「増やせ」の向きに振ってある。
# Gemma 4 31B は逆に出しすぎるため（COMPARE_gemma31b_vs_qwen32b.md の実測:
# フィラー 3.70 対 1.97 個per100字、読点 16.23 対 5.29、終助詞ターン率 39.0% 対 15.4%）、
# 同じ指示を当てると増幅方向に働く。dialogue.prompt_profile（既定 auto＝モデル名から
# 判定）が選んだプロファイルの old → new を、それぞれ1回だけ置換する。
#
# ★指示の総量には上限がある。指示を3行足したら、無関係な「自分の名前」ゲートの
#   棄却率が 9.5%→20.6% に上がった実測がある。プロファイルは行を**足さずに
#   差し替える**方針で書くこと。
# ★old が本文に見つからなければ実行時に AssertionError で落ちる（黙って素通しに
#   しない）。上の本文を編集したら、ここの old も必ず合わせて直すこと。
profile_patches:
  qwen: {}
  gemma:
    system_prompt:
    - old: |-
        - 極短（1〜6文字）: 直前の発話の語を短く聞き返す・驚く・先を促す反応。
          — 全体の1割程度。会話が動いている前半〜中盤に散らすとテンポが締まる。
      new: |-
        - 極短（1〜6文字）: 直前の発話の語を短く聞き返す・驚く・先を促す反応。
          — 全体の2割程度。会話が動いている前半〜中盤に散らすとテンポが締まる。
    - old: |-
        - 短い反応・問い返し（7〜15文字）: 直前の発話への具体的な反応・確認・問い返し。
          — 全体の3割くらい。
        - ふつうの発話（16〜30文字）: 1つの内容を言い切る。 — 全体の3〜4割。
      new: |-
        - 短い反応・問い返し（7〜15文字）: 直前の発話への具体的な反応・確認・問い返し。
          — 全体の4割くらい。
        - ふつうの発話（16〜30文字）: 1つの内容を言い切る。 — 全体の3割。
    enriched_section:
    - old: |-
        - ★★発話が長くなるほど、フィラーも読点も増やす。長い発話ほど、人は途中で言葉に
          詰まり、息継ぎをし、考えながら喋ります。長い発話を一息ですらすら言い切らせると、
          音声にしたとき機械が読み上げているようにしか聞こえません。
          発話ごとに、その長さから個数を決めてください（実質文字数＝句読点を除いた文字数）:
      new: |-
        - ★★フィラーは**入れすぎるほうが不自然**です。あなたは言いよどみを過剰に入れる
          傾向があります。下の表は**上限**であってノルマではありません。表の個数を超えた
          出力は不合格です。迷ったら入れないほうを選んでください。
          発話ごとに、その長さから上限を決めてください（実質文字数＝句読点を除いた文字数）:
    - old: |-
        - ★★実質26文字を超える長い発話では、さらに細かく__SPAN_LONG__文字前後ごとに切る。
          長い発話の中に、読点を打たずに__COMMA_SPAN__文字以上続く箇所を1つも残さないこと
          （上の「発話の長さごとの個数」の読点の数を必ず満たす）。
      new: |-
        - ★★読点は**打ちすぎるほうが不自然**です。あなたは読点を過剰に打つ傾向が
          あります。実質100文字あたり__COMMA_PER_100__個を**超えない**こと。ひとまとまりの
          文節を読点で刻まないでください。
          - 悪い例:「私は、その、主婦、をしています。」← 「主婦をしています」は一続き。
          - 良い例:「私は、その、主婦をしています。」
        - ★「、」を2つ以上続けて書かない（「、、」「、、、」は禁止）。「。」「？」の直後に
          「、」を置かない（「。、」「？、」は禁止）。間を長く取りたいときも読点は1つだけ。
    allow_self_name_lines:
    - old: |-
        - 「ユウくん、どう思う？」のような相手への呼びかけを、呼ばれている本人（ユウ）の
          セリフにしない（話者の取り違えに注意）。
      new: |-
        - ★各 turn を書く前に、その speaker が「いま喋っている本人」かを確認する。
          発話の中で名前を口にするときは、それが**相手**の名前かを必ず確かめること。
          自分の名前で呼びかける（「ユウくん、どう思う？」をユウ本人のセリフにする）、
          自分を三人称で語る（サトウ本人が「サトウは〜」と話す）のはどちらも
          話者の取り違えで、不合格です。
