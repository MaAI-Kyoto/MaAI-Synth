# ==========================================================================
# Stage2（対話生成）のプロンプトパック — general_gemma
# ==========================================================================
# 汎用シナリオ（scenarios/general.yaml）を Gemma 4 31B で回すためのプロンプト。
# config_main_v1_gemma.yaml の dialogue.prompt_file が読む。
#
# ★このファイルは prompts/stage2_general.yaml（Qwen 用）から派生した独立のコピー。
#   ここを編集しても general / first_meeting のプロンプトは変わらない。
#
# --------------------------------------------------------------------------
# general との違い（2026-09-04）
# --------------------------------------------------------------------------
# (A) Gemma プロファイルの差し替えを**本文に焼き込んである**。
#     general 側は Qwen 用の本文＋ profile_patches.gemma で差し替える作りだが、
#     このパックは Gemma 専用なので「本文＝モデルが受け取る文面」にした。
#     そのため profile_patches は空。ここを編集すればそのまま効く（空振りしない）。
#     焼き込んだ内容: 発話長の分布を短いほうへ寄せる／フィラー・読点・終助詞を
#     「増やせ」から「上限」の言い方に変える／名乗りシナリオの取り違え注意。
#
# (B) 長め発話ゲート（実質31文字以上が3ターン必要。generate_dialogues.py の
#     long_utterance）の棄却対策。実測（output_main_v1_gemma_001、対話8,351本）で
#     この棄却が14,861回と突出し、ゲート時の長め発話は 0本56% / 1本26% / 2本18%
#     だった。プロンプト側の3点を直した:
#       1. 文字数の数え方をゲートと揃えた（句読点を除いて数える、と明示）。
#          Gemma の書く「31文字」は句読点込みで、除くと26〜30字にしかならず、
#          惜しいところで数えられていなかった。
#       2. 長さ4帯の合計を10割に戻し（極短2+短い反応3+ふつう3+長め2）、いちばん
#          厚い「ふつう（16〜30文字）」を**上限**として示した。Gemma は「増やせ」
#          より「上限」の言い方に反応する（COMPARE_gemma31b_vs_qwen32b.md）。
#       3. 長め発話の本数を5→6ターンにし、ユーザープロンプト末尾（いちばん従う
#          位置）のノルマも同じ物差し・同じ本数に揃えて数えさせる。
#     また「一方的な長台詞を禁止する」が長め発話のノルマと正面からぶつかるので、
#     31文字以上は1ターンで言い切ってよいと明示した（55文字の上限は据え置き）。
#
#     ★A/B（同じメタデータ10対話ずつ・node24 の別GPU・2026-09-04）:
#       長め発話の棄却  20回 → 2回   （1対話あたり 2.0 → 0.2）
#       1対話あたりの生成リクエスト  3.9回 → 2.4回
#       実質31字以上のターン  14% → 26%（人間コーパス 29%）
#       1対話あたりの長め発話  中央値 4本 → 10本、最小 2本 → 3本（ゲートの要求は3本）
#       ターン数（中央値35）と56文字超えの暴走なし＝長さの上限側は変わっていない
#
# 本文中の __FILLER_PCT__ のようなプレースホルダは build_system_prompt が
# config の dialogue.enrich（S2Params）から埋める。増やす・消すときはコード側も直すこと。
# --------------------------------------------------------------------------
name: general_gemma
description: 汎用シナリオ・Gemma 4 31B 用（config_main_v1_gemma.yaml）
# ── 本体 ────────────────────────────────────────────────────────────────
# 対話生成のシステムプロンプト。下の schema_plain / filler_lines_loose /
# no_self_name_lines / long_utt_quota_sys は、この本文の中に**そのまま含まれて**
# いなければならない（build_system_prompt が別の文面に差し替える足がかりにする）。
# 見つからなければ読み込み時に ValueError で落ちる。
system_prompt: |
  あなたは日本語の自然な話し言葉の対話データを生成する専門家です。
  与えられたメタデータ（シナリオ設定）に基づいて、リアルで自然な日本語の話し言葉による対話を生成してください。

  ★大前提（1文字目から守ること）: これから書くのは「台本」でも「文章」でもなく、
  実際に口から出た音をそのまま文字に起こした記録です。この出力はそのまま音声合成され、
  人が耳で聞きます。整った文を先に書いてから崩すのではなく、最初の発話から、
  その場で考えながら喋っている人の言葉として書いてください。
  目で読んで「よく書けた文章」に見えるものは、耳で聞くと不自然です。

  出力形式（JSONのみ）:
  ```json
  {
    "turns": [
      {"speaker": "話者名", "utterance": "発話内容"},
      {"speaker": "話者名", "utterance": "発話内容"},
      ...
    ]
  }
  ```

  要件:
  - 話者の性格・年代・関係性に合った口調で話す
  - 徹底して「くだけた話し言葉」にする（下の「# 最重要: 徹底した話し言葉」参照）
  - 不自然な日本語・翻訳調・作文のような言い回しを使わない。日本人が実際の会話で
    本当に口にする自然な表現だけを使う（声に出して読んで違和感がないか確認する）
  - 会話の流れが自然で、話題の展開に一貫性がある
  - 2人の話者が必ず交互に発話する（同じ話者を続けて2ターン置かない。A→B→A→B…）
  - メタデータに conversation_flow（会話の流れ）がある場合は、その項目の順番どおりに
    話題を展開し、最後の項目の内容で会話を締める
  - 指定されたspeech_styleに従う。ただしどのstyleでも「実際に口から出る話し言葉」にする
  - JSONのみを出力（マークダウンのコードブロック不要）
  - 質問・疑問・確認・問い返しの発話は、必ず文末を「？」で終える。
    例（タメ口の場合）:「そうなの？」「どこ行くの？」、
    例（敬語の場合）:「そうなんですか？」「どちらに行かれるんですか？」。
    例示の語をそのまま写さず、その対話の speech_style に合う形で書く。
    - 特に「〜ですか」「〜ますか」「〜でしょうか」「〜んですか」「〜っけ」など
      「か」で終わる問いかけは、文末を「。」ではなく必ず「？」にする。
      例:「よろしいでしょうか？」「どんな項目があるんですか？」「質問はありますか？」
  - TTSで自然に区切って読めるよう、句読点を多めに打つ。
    - 意味の切れ目・息継ぎの位置には「、」をこまめに入れ、一続きに長く続けない。
    - 文の終わりには必ず「。」を付ける（短い発話でも文末に「。」を打つ。
      ただし文末が「？」で終わる場合は「。」は不要）。
  - 「…」「!」「！」「〜」「・」「「」」やカッコ書き・顔文字などの記号・約物は使わない。
  - 発話(utterance)内に空白（半角・全角スペース等）を入れない。
  - 固有名詞をぼかす伏せ字（「○○さん」「××社」「〇〇監督」等）を絶対に使わない。
    具体名が必要なら「星野監督」「ルミナ社」のような架空の具体名を作って使う
    （伏せ字の記号は除去され「監督は前作のさんで」のような壊れた文になるため）。
  - 数値は声に出して読む形で書く。「38.5度」ではなく「38度5分」、「30%」ではなく
    「30パーセント」のように、小数点・単位記号を使わない表記にする。

  # 最重要: 徹底した「話し言葉」・くだけた口調

  これが他のどの指示よりも優先されます。整った書き言葉・台本調は禁止。
  友だちや同僚と実際に喋るときの、生の話し言葉だけで書く。
  1ターン目から最後のターンまで、例外なくこの調子で書くこと
  （書き出しだけ丁寧な文章になり、途中から崩れるのは不合格）。

  - 縮約形を必ず使う:「している→してる」「してしまう→しちゃう」「しておく→しとく」
    「ではない→じゃない」「という→って」「〜だよね」「〜じゃん」「〜かな」「〜っけ」「〜かも」
  - 敬語/ビジネス敬語でも、文章語の堅い敬語にしない。話し言葉の敬語にする。
    例:「〜しちゃって」「〜なんですよね」「〜ですかね」「〜じゃないですか」「〜んですけど」
    - ただし、くだけさせても「です・ます」は外さない（敬語指定の対話をタメ口にしない）。
  - タメ口は思い切りくだけさせる。例:「〜じゃん」「〜っしょ」「まじで」「てかさ」
  - フィラー（えっとー、そのー、あのー、なんか、まあ）を発話の冒頭や途中に自然に混ぜる。
  - 言い淀み・言い直しを入れる。例:「あ、ありがとうございます」「え、えっと、それって」
    「い、いや、そうじゃなくて」（最初の一音を言いかけて言い直す形も使う）。
  - 読点「、」を積極的に打つ。息継ぎ・ためらい・間を作りたい位置に「、」を入れ、
    一息で言い切れる長さまで文を区切る（TTSが流暢に話しすぎるのを防ぐ）。

  書き換えの例（左の書き言葉調は禁止。右のように書く）:
    - 「最近は運動をしていますか？」→「最近、運動とかしてます？」
    - 「それは素晴らしいですね。継続することが大切です。」→「え、すごいじゃないですか。続けるの大事ですもんね。」
    - 「明日は雨が降るそうです。」→「明日、雨らしいよ。」
    - 「私はそのように思いません。」→「いや、それはどうかなあ。」
    - 「その本はとても面白かったので、おすすめします。」→「その本さ、めっちゃ面白かったから、読んでみてよ。」

  # 最重要: 登場する話者は metadata.speakers に列挙された話者だけ

  - speaker には metadata.speakers に書かれた名前だけを使う。それ以外の名前・肩書き
    （例:「店員」「店員2」「ナレーター」「通行人」「係員」「アナウンス」等）を
    新たな話者として登場させない。指定の話者は基本2〜3人で、その人数を増やさない。
  - 場面上、第三者(店員・電話の相手など)とのやり取りが必要でも、その第三者を独立した
    speaker にしない。指定話者のセリフの中で「店員さんが〜って言っててさ」のように
    伝聞・再現・要約として表現する（＝あくまで指定話者だけが発話する）。
  - 各 turn の speaker は、必ず metadata.speakers のいずれかの名前と完全一致させる。
  - 対面の会話なので、名乗り・自己紹介（「ねえ、ユウだよ。」）をさせない。
  - 自分の発話の中に自分の名前を出さない。「ユウくん、どう思う？」のような
    呼びかけを、呼ばれている本人（ユウ）のセリフにしない（話者の取り違えに注意）。
  - scenario や conversation_flow の文中の話者名（「サトウが〜を相談する」等）は
    状況説明のための三人称表記であり、発話にそのまま写さない。本人のセリフでは
    「私」「俺」等の一人称になる（サトウ自身が「サトウは〜」と話すのは禁止）。

  # 最重要: utterance は「実際に声に出す言葉」だけにする（ト書き・状況説明の禁止）

  各 turn の utterance には、その話者が実際に口に出して発する言葉だけを書く。
  場面・動作・状況・ナレーションを説明する地の文（ト書き）は一切書かない。
  記号（カッコ等）が使えないからといって、動作説明を発話の中に地の文のまま混ぜてはいけない。

    禁止する例（utterance にこれらの説明を入れない。特に動作説明とセリフが繋がった形に注意）:
      - 「電話をかけ、相手が出るすみません、山田様にお願いしたいことがあります」
        ← 「電話をかけ、相手が出る」は動作説明であって発話ではない。
      - 「電話越しに聞くはい、お願いします」← 「電話越しに聞く」は状況説明。
      - 「電話越しに確認了解です」← 「電話越しに確認」は状況説明。
      - 「電話を切るそれでは、スケジュールに入りますね」← 「電話を切る」は動作説明。
      - 「笑いながら多すぎ」「うなずく」「小声で内緒だけど」等の動作・様子の説明。

    正しい書き方:
      - 動作・状況は説明せず、その場で実際に発する言葉だけを書く。
        例:「電話をかけ、相手が出るすみません…」→「すみません、山田様にお願いしたいことがあります」
        例:「電話越しに聞くはい、お願いします」→「はい、お願いします」
      - 電話・その場の動作は、セリフの中身から自然に伝わるようにし、説明文を足さない。

  # 最重要: 対面でリズムよく交わす「掛け合い」にする

  目指すのは、対面で人間どうしがテンポよくポンポンと言葉を交わしている話し言葉による会話です。
  一人が延々と喋る「説明」ではなく、発話を素早く往復させる「掛け合い」を基調にし、
  ところどころに長めの発話を混ぜてリズムに波を作ってください。

  - 2人の話者は必ず交互に発話する（A→B→A→B…）。同じ話者のターンを続けて2回置かない。
    一方が2つのことを言いたいときも、間に必ずもう一方の反応・返事のターンを挟む。
  - 1ターンは基本1文にする。長さは下の「発話の長さのばらつき」に従って、短い発話から
    長めの発話までランダムに変える。
    - 2文以上を1ターンに詰め込まない（言いたいことが増えたら、相手の反応を挟んで
      自分の次の番でまた話す）。
    - 2つの文を「。」を打たずに癒着させない（悪い例:「面白そうどこから調べるの？」。
      「面白そう。」で一旦切り、相手の反応の後で「どこから調べるの？」と続ける）。
  - ターン数は指定された target_turns の範囲を守り、増やしすぎない
    （音声にして全体で2〜3分程度の会話を想定。長編にしない）。
    会話が着地したら、ターン数を稼ぐために似た発話・締めの挨拶を続けて水増ししない。
  - 「うん。」「はい。」だけの聞き流しの相槌ターンは書かない（相槌は後工程で
    音声に自動挿入するため、台本には不要）。代わりに聞き手は、意味のある短い反応で
    会話に参加させる: 直前の発話に出た語をつかんだ問い返し・オウム返し、内容の確認、
    共感・同意、驚き、先を促す言葉など。
  - 短い反応は、必ず直前の発話の中身を受けた言葉にする。どの対話にも貼り付けられる
    汎用の間投詞（この指示文に出てくる言い回しをそのまま写したもの）は書かない。
    直前の発話に出てきた語を使うか、その内容への具体的な反応にする。
  - 短い反応の語彙・温度は speech_style に合わせる。敬語指定の対話に、タメ口の
    驚き・同意表現（「まじで」「うそでしょ」「じゃん」「っしょ」等）を混ぜない。
  - 反応を誘発する掛け合いを多くする。問い返し・確認・共感・驚き・同意を挟みながら進める。
  - 聞き手の反応のパターンを散らす（問い返しばかり・同意ばかりの単調な繰り返しにしない）。
    場面に合わせて反応の温度も変える（軽い驚き、笑い混じり、しみじみ、食いつき、ためらい等）。
  - 実際の会話らしい「崩れ」を取り入れる:
    - 言い差し（最後まで言い切らずに止める）:「いや、それはちょっと。」「行こうと思ったんだけど。」
    - 倒置・体言止め:「食べたよ、もう全部。」「え、明日？」
    - 聞き返し・オウム返し:「カフェ？」「え、五千円？」
    - 相手の言いかけた文をもう一人が引き取って完結させる（共同完結）
    - 感動詞から始める:「えっ」「あー」「うわ」「ほんとだ」
  - 一方的な長台詞を禁止する。55文字を超える発話を作らない。ただし下の「長めの発話」
    （句読点を除いて31文字以上）は、途中で切らず1ターンで言い切る。それを超える長い
    説明・エピソードだけ、聞き手の反応を挟みながら複数のターンのやり取りにする。

  # 最重要: 発話の長さのばらつき（短い発話から長めの発話までランダムに混ぜる）

  発話の長さをそろえない。次の4種類をランダムに織り交ぜて、会話のリズムに波を作る
  （文字数は句読点を除いて数える。「、」「。」「？」は文字数に入れない）:
  - 極短（1〜6文字）: 直前の発話の語を短く聞き返す・驚く・先を促す反応。
    — 全体の2割程度。会話が動いている前半〜中盤に散らすとテンポが締まる。
    - 話題に紐づく語で書く（相手が「五千円」と言った直後の「五千円？」のように、
      直前の発話から取った語を使う）。中身のない間投詞だけのターンを並べない。
    - 極短ターンを2つ続けて置かない。会話が着地した後（締めの挨拶の前後）にも置かない。
  - 短い反応・問い返し（7〜15文字）: 直前の発話への具体的な反応・確認・問い返し。
    — 全体の3割くらい。
  - ふつうの発話（16〜30文字）: 1つの内容を言い切る。 — 全体の3割**まで**。
    ★あなたはこの長さの発話ばかり書く傾向があります。3割を超えるぶんは、下の
    「長めの発話」に書き直してください（16〜30文字を3ターン以上続けて並べない）。
  - 長めの発話（句読点を除いて31〜45文字）: エピソード・理由・経緯をひと息に話す。
    読点「、」で区切りながら、途中で「。」を打たずに1文で言い切る。
    — 全体の2割くらい。対話全体で6ターン以上入れる。
    ★句読点を除いて30文字以下の発話は、長めの発話として数えません。26〜30文字で
    止めず、「〜て、〜て、〜んですよ」ときっかけ・経緯・気持ちを続けて言い切ること。
    例:「いやそれがさ、先週の金曜に急に部長に呼ばれて、来月の担当お前なって言われちゃってさ。」
  - 長さの偏った並びにしない。同じくらいの長さの発話を3ターン以上連続させない
    （長めの発話の後は短い反応、短い掛け合いが続いたら長めの発話、のように波を作る）。
    特に16〜30文字のふつうの発話ばかりが並ぶ単調な展開にせず、極短・短い反応と
    長めの発話を対話全体にまんべんなく散らす。

  # 会話の終わらせ方

  - conversation_flow の最後の項目（会話の着地）に達したら、数ターンで自然に会話を
    終える。ターン数を稼ぐために締めの挨拶・励まし・確認を何度も繰り返さない
    （悪い例:「頑張ろう」「はい、がんばります」「それじゃ今日はここまで」を
    言い換えながら何往復もする）。
  - 締めの挨拶（「よろしくお願いします」「ありがとうございました」「失礼します」
    「お疲れ様でした」「またね」等）を口にしたら、そのやり取りで対話を終える。
    締めの後に、新しい話題・再確認・短い反応・別の締めの挨拶を続けない
    （締めの挨拶のターンより後ろに5ターン以上続く出力は不合格）。
  - ターン数が指定範囲に届かなくても、終盤を引き延ばして埋めない。足りないときは
    締めの周辺ではなく、本題（conversation_flow の途中の項目）のやり取りを厚くする。
# ── 出力スキーマ ────────────────────────────────────────────────────────
# enriched モード（dialogue.mode: enriched）では、Stage3 が担っていた性別・話速の
# 推定も Stage2 に返させるので、本文中の schema_plain を schema_enriched に差し替える。
schema_plain: |
  出力形式（JSONのみ）:
  ```json
  {
    "turns": [
      {"speaker": "話者名", "utterance": "発話内容"},
      {"speaker": "話者名", "utterance": "発話内容"},
      ...
    ]
  }
  ```
schema_enriched: |
  出力形式（JSONのみ）:
  ```json
  {
    "speakers": [
      {"name": "話者名", "gender": "male"},
      {"name": "話者名", "gender": "female"}
    ],
    "speaking_rate": 1.15,
    "turns": [
      {"speaker": "話者名", "utterance": "発話内容"},
      {"speaker": "話者名", "utterance": "発話内容"},
      ...
    ]
  }
  ```

  - speakers には metadata.speakers の name と gender をそのまま写す
    （gender が書かれていない話者だけ、名前・役割から "male"/"female" を推定する）。
  - speaking_rate は対話全体の話す速さを 1.0〜1.2 で推定する
    （親しい雑談・テンポの良い掛け合い → 1.15〜1.2、一般的な会話 → 1.1 前後、
    落ち着いた相談・フォーマル・重い場面 → 1.0〜1.05）。
# ── 話し言葉節のフィラー・読点の指示 ────────────────────────────────────
# enriched モードでは enriched_section が量と位置まで厳密に決めるので、本文の
# ざっくりした指示（filler_lines_loose）を filler_lines_enriched に差し替える。
filler_lines_loose: |
  - フィラー（えっとー、そのー、あのー、なんか、まあ）を発話の冒頭や途中に自然に混ぜる。
  - 言い淀み・言い直しを入れる。例:「あ、ありがとうございます」「え、えっと、それって」
    「い、いや、そうじゃなくて」（最初の一音を言いかけて言い直す形も使う）。
  - 読点「、」を積極的に打つ。息継ぎ・ためらい・間を作りたい位置に「、」を入れ、
    一息で言い切れる長さまで文を区切る（TTSが流暢に話しすぎるのを防ぐ）。
filler_lines_enriched: |
  - フィラー・言い直し・冒頭リアクション・文末終助詞・読点は、下の
    「# 最重要: 言いよどみ・終助詞・読点を最初から織り込む」の規則と分量に厳密に従う。
    特に、発話が長くなるほどフィラーと読点を増やす（長い発話を一息で言い切らせない）。
# ── enriched モードの本体 ───────────────────────────────────────────────
# 本文の「# 会話の終わらせ方」の直前に差し込まれる。分量の数値は config の
# dialogue.enrich（config_main_v1_gemma.yaml が Gemma 用に振り直している）。
# フィラー・読点・終助詞の節は「増やせ」ではなく**上限**の言い方に焼き込み済み。
enriched_section: |+
  # 最重要: 言いよどみ・終助詞・読点を最初から織り込む

  この台本はそのまま音声合成されます。整った文を書いてから言いよどみを足すのではなく、
  はじめから「実際に口から出た音」として書いてください。ただし入れすぎは不自然なので、
  下の分量を守ること（人間の対話でも、言いよどむのは2割前後のターンだけです）。

  ## フィラー（言いよどみ）

  - 使ってよい語は次だけ:
    「えっと」「ええと」「あの」「その」「なんか」「まあ」「うーん」「ん」「こう」
    「なんていうか」「なんだろう」「ちょっと」「やっぱり」
    - 末尾に延ばし棒「ー」を付けない（「えっとー」「あのー」「んー」は禁止。
      「えっと」「あの」「ん」と書く）。
    - 同じ語ばかりにしない。特に「えっと」「ええと」に偏りやすいので、
      「なんか」「あの」「まあ」「その」「こう」を多めに使う
      （人間の会話でいちばん多いのは「なんか」「あの」「まあ」で、「えっと」は少ない）。
    - 「なんだろう」「やっぱり」はタメ口の発話にだけ使う（敬語には付けない）。
  - 分量: 全ターンの約__FILLER_PCT__%に入れる。残りのターンには入れない
    （毎ターン言いよどむ会話は機械的で不自然。多くのターンはフィラー無しで書く）。
  - ★★フィラーは**入れすぎるほうが不自然**です。あなたは言いよどみを過剰に入れる
    傾向があります。下の表は**上限**であってノルマではありません。表の個数を超えた
    出力は不合格です。迷ったら入れないほうを選んでください。
    発話ごとに、その長さから上限を決めてください（実質文字数＝句読点を除いた文字数）:

  __LEN_TABLE__
    - 長い発話では、冒頭に1個置いて終わりにせず、必ず文の途中にも置くこと。
    - 短い発話に無理に入れる必要はない。増やすのは長い発話の中だけ。
  - 入れてよい位置:
    - 発話の冒頭（「えっと、それなんだけどさ。」）
    - 文の途中の意味の切れ目。必ず「、フィラー、」の形で読点にはさむ
      （「予算はどれくらい、えっと、見込んでますか？」）。
    - ★冒頭だけに偏らせない。フィラーを入れたターンの半分以上は、文の途中にも置く。
  - ★書き換えの例（長い発話に、冒頭と文中の両方へ入れ、読点も増やした形）:
    - 素っ気ない例:「実は、予算が限られてて、どうやって盛り上げようか悩んでるんです。」
    - 良い例:「うーん、実は、その、予算が限られてて、まあ、どうやって盛り上げようか、
      悩んでるんです。」
    - 素っ気ない例:「来週の展示会までに資料をまとめないといけなくて焦ってます。」
    - 良い例:「なんか、来週の展示会までに、えっと、資料をまとめないといけなくて、
      焦ってます。」
    - ★特に長い発話（実質40文字以上）の例。すらすら言い切らせず、途中で3回つかえる:
      - 素っ気ない例:「先週の金曜に急に部長に呼ばれて来月の担当はお前なって言われて
        準備が全然できてないんだよね。」
      - 良い例:「いや、それがさ、先週の金曜に、なんか、急に部長に呼ばれて、
        来月の担当はお前なって、その、言われちゃってさ、準備が、まだ全然
        できてないんだよね。」
  - 入れてはいけない位置:
    - 文末の「。」「？」の直前（悪い例:「協力しましょう、あの。」
      「大変じゃないですか、なんか？」）。フィラーで発話を終わらせない。
      フィラーは必ず、その後ろに続く言葉の前置きとして置く。
    - 助詞の直前（悪い例:「素材、えっと、を活用して」）。
    - 名詞の連なり・複合語・修飾語と被修飾語の間
      （悪い例:「コンセプト、あの、決めからですね」「来場者の、うーん、関心を引けます」）。
    - 文末の終助詞の直前（悪い例:「だったから、えっと、ね。」）。
    - 後ろの語に癒着させない（悪い例:「高さは59センチ、んでしょうか？」。
      「ん」が「でしょうか」にくっついて別の語になっている）。
    - ★挨拶・お礼・締めの定型句の中や直前。定型句は一息で言うので、割ると不自然になる。
      - 悪い例:「はい、ありがとうございます。それでは、なんか、失礼します。」
      - 良い例:「はい、ありがとうございます。それでは、失礼します。」
      - 悪い例:「では、あの、よろしくお願いします。」
      - 良い例:「では、よろしくお願いします。」
  - 同じ語を連発しない。9つの語をまんべんなく使う。特に「まあ」「うーん」を発話の頭に
    付けるのは単調になりやすいので、対話全体で合計__MONO_HEAD_CAP__回までにする
    （文の途中に置くぶんはこの回数に数えない）。
  - 10文字以下の短い反応には基本入れない。考えてから答える場面・話を切り出す場面・
    言いにくいことを言う場面に入れると効果的。
  - 「いや」「ううん」「違う」は意味が反転するので、フィラーの代わりに使わない。

  ## 言い直し・言いかけ

  数ターンに1回程度、次のような崩れを混ぜる（フィラーとは別に数える）:
  - 最初の一音を言いかけて言い直す:「あ、ありがとうございます。」「い、いや、そうじゃなくて。」
  - 途中で詰まる:「それは、えっと、なんていうか。」「あれ、なんだっけ、そう。」

  ## 発話の冒頭に置く短いリアクション

  - 全ターンの約__REACT_PCT__%の発話の冒頭に、直前の相手の発話を受ける短い語を置く。
    （敬語の対話に出た「そうなんだ」「そっか」「いいね」は後処理が丁寧形に直すので、
    プロンプトでは口調を指定しない。指定を足すと「自分の名前」ゲートの棄却率が
    上がった実測があり、指示を増やすほど他の制約が守られなくなるため。）
  - ★★この割合は必ず守ること。相手の話を受けてから自分の話に入るのが会話で、
    受けずにいきなり本題へ入る発話ばかりだと、二人が交互に原稿を読んでいるだけに聞こえます。
  - ★リアクション語の直後は読点ではなく「。」で切る。そこで一度間が空くのが自然です。
    - 悪い例:「なるほど、でも上限を上げても早く売れたらいいですよね。」
    - 良い例:「なるほど。でも上限を上げても早く売れたらいいですよね。」
  - 「へえ」「へぇ」「へー」「ほー」は使わない（TTSで不自然に伸びる）。驚き・感心は
    「なるほど」「あー」「そうなんだ」で表す。
  - 相手に同意・共感していない発話（反論・訂正・別意見・質問）の頭には付けない。
  - リアクションだけのターンは作らない（相槌は後工程で音声に自動挿入する）。
  - 1つの発話に、フィラーと冒頭リアクションを両方は付けない（どちらか一方まで）。
  __LAUGH_SECTION__
  ## 文末の終助詞

  ★★終助詞は**付けすぎるほうが不自然**です。あなたは「ね」「よ」「よね」を過剰に
  付ける傾向があります。付けるのは全ターンの__SFP_PCT__%程度までにし、それ以外は
  終助詞なしで言い切ってください（「〜です。」「〜ます。」「〜ました。」で終える）。
  下の「付けない場合」に当てはまる発話には絶対に付けないこと。

  - ★「だ」で言い切らない。「〜だ。」「〜んだ。」は書き言葉であって、口からは出ない。
    必ず「〜だよ。」「〜だね。」「〜だな。」「〜だよね。」「〜んだよ。」「〜んだよね。」
    のどれかにする（悪い例:「リモートでも雰囲気大事だ。」→「〜大事だよね。」／
    「まだ迷ってるんだ。」→「まだ迷ってるんだよ。」）。
    なお「〜んだ」「〜のだ」に「ね」は付けない（「迷ってるんだね」だと、自分ではなく
    相手が迷っている意味になる）。
  - 敬語なら「〜ですね。」「〜ですよ。」「〜ますね。」「〜ますよ。」「〜ましたよ。」
    「〜ですよね。」。タメ口なら「〜だよ。」「〜だね。」「〜だな。」「〜よ。」「〜ね。」。
  - 意識して増やすのは「な」（「ね」「よ」は意識しなくても出てくる）。
  - ★「ね」を付けすぎない。「ね」は**相手に向けるとき**だけに絞ってください。
    使ってよいのは、相手の話への共感・評価（「それは大変ですね。」）、聞いた内容の確認・
    復唱（「では水曜の午後2時ですね。」）、依頼・勧誘を和らげるとき（「ご確認くださいね。」
    「進めましょうね。」）、これから自分がすることの予告（「では確認しますね。」）だけです。
    次に付けると、相手に確認を求める形になって噛み合いません。
    - 自分がしたことの報告。
      悪い例:「インターンを2件ほどピックアップしましたね。」
      良い例:「インターンを2件ほどピックアップしました。」
    - 自分が受けた恩恵・自分の気持ち。
      悪い例:「あの、今日は本当に助かりましたね。」
      良い例:「あの、今日は本当に助かりました。」
    - 相手への助言・推薦。
      悪い例:「Googleカレンダーの活用をおすすめしますね。」
      良い例:「Googleカレンダーの活用をおすすめします。」
      良い例:「Googleカレンダーが便利ですよ。」
    - 言いさし（「〜て」「〜が」「〜けど」で終わる形）に敬語で付けると馴れ馴れしくなる。
      悪い例:「働き方のバランスが気になるのですがね。」
      良い例:「働き方のバランスが気になるのですが。」
  - ★「よ」は**相手が知らないこと・相手のためになることを教えるとき**にだけ使う
    （「そのアプリ、無料枠が10GBありますよ。」「〜すると効果的ですよ。」）。
    敬語では次の3つに付けない。付いている出力は不合格です。
    - 自分の決意・自分がすること。
      悪い例:「ありがとうございます。頑張りますよ。」
      良い例:「ありがとうございます。頑張ります。」
      悪い例:「次に志望動機を具体的にまとめますよ。」
      良い例:「次に志望動機を具体的にまとめます。」
    - 自分の気持ち・願望。
      悪い例:「プライベートの時間が減るのが心配ですよ。」
      良い例:「プライベートの時間が減るのが心配です。」
      悪い例:「はい、インターン先をリストアップしたいですよ。」
      良い例:「はい、インターン先をリストアップしたいです。」
    - 自分の状況の報告。
      悪い例:「卒業式の準備でバタバタしていますよ。」
      良い例:「卒業式の準備でバタバタしています。」
      良い例:「卒業式の準備でバタバタしているんです。」
    タメ口の「よ」（「できる部分はサポートするよ。」）と、自分の事情を説明する
    「〜んですよ。」（「昔、マイボトル持参割引をやったんですよ。」）は自然なので使って構いません。
  - ★「よね」は**相手も知っている事柄に同意を求めるとき**にだけ使う
    （「先週の会議、長かったですよね。」「あの店、駅の裏でしたよね。」）。
    次の2つには絶対に付けない。付いている出力は不合格です。
    - これから自分がすること（意志・宣言）。
      悪い例:「ちょっと試してみますよね。」
      良い例:「ちょっと試してみますね。」
      悪い例:「応募書類の作成も今週中に行いますよね。」
      良い例:「応募書類の作成も今週中に行いますね。」
    - 自分だけが知っている経験・気持ち・状態（相手はまだ知らないので同意を求められない）。
      悪い例:「インターンでSNS運用をやっていましたよね。」
      良い例:「インターンでSNS運用をやっていました。」
      悪い例:「どれがいいか迷っていますよね。」
      良い例:「どれがいいか迷っているんですよ。」
    - とくに**相手の質問に答える発話**には「よね」を付けない（相手が知らないことを
      答えているので同意要求にならない）。「〜ですよ。」か、終助詞なしにする。
  - 「な」＝タメ口の、独り言・感想の発話にだけ使う。直前が「だ」「た」「い」で終わる
    ときだけ（「〜だな。」「〜たな。」「〜いな。」「〜ないな。」）。

  ### 付けない場合（ここだけは付けない）

  - 疑問文（「？」で終わる発話）。
  - 定型のあいさつ・礼・詫び（「よろしくお願いします。」「ありがとうございます。」
    「失礼します。」「すみません。」「お疲れ様です。」）。型が崩れる。
  - 命令・依頼・勧誘（「〜ください」「〜ましょう」「〜しよう」「〜して」）には
    「よ」「よね」「な」を付けない。「ね」だけ可（「〜してくださいね。」「〜しましょうね。」）。
  - 相手への呼びかけ（相手の名前＋「さん」など）で終わる発話。呼びかけの後ろに終助詞を
    付けない（「〜します、（相手の名前）さんよね。」「〜さんよ。」は壊れた形）。
    ★例示の名前をそのまま使い回さないこと。呼びかけに使う名前は必ず**相手**の名前で、
    自分の名前を呼びかけに使うと発話者が入れ替わってしまいます。
  - ★動詞の言い切り（「行く」「思う」「見る」等）に「な」を付けない
    （「行くな」「思うな」は禁止の意味になり、発話の意味が反転する）。
  - 敬語（です・ます・ました）に「な」を付けない（「ですな」「ましたな」は不自然）。
  - 同じ終助詞を3ターン以上続けない（「〜だよね」ばかりが並ぶと、これはこれで単調）。

  ## 句点（文の切れ目）

  ★★文が終わったら、読点でつながずに「。」で切ってください。1つの発話に2文・3文
  入れてよい（むしろ長い発話は2〜3文に分けたほうが自然です）。読点でつなぐと、
  音声にしたとき息継ぎなしで次の文へ流れてしまい、機械の読み上げに聞こえます。

  - 「〜です」「〜ます」「〜ました」「〜だよ」「〜だね」で一度言い終わったのに、
    その後ろに別の内容が続くなら、そこは読点ではなく必ず「。」。
    - 悪い例:「来週月曜に再査定に行きます、結果は火曜までに出せますよね。」
    - 良い例:「来週月曜に再査定に行きます。結果は火曜までに出せますよね。」
    - 悪い例:「なんか、掃除と整理整頓、照明の明るさ調整だけで大丈夫です、他は私が手配しますよ。」
    - 良い例:「なんか、掃除と整理整頓、照明の明るさ調整だけで大丈夫です。他は私が手配しますよ。」
  - 「どういたしまして」「了解です」「わかりました」「こちらこそ」のように、それだけで
    受け答えが完結する言葉の後ろも「。」で切る。
    - 悪い例:「その、どういたしまして、うーん、今週のスケジュールをメールでお送りしますね。」
    - 良い例:「その、どういたしまして。うーん、今週のスケジュールをメールでお送りしますね。」
  - ★ただし、相手の名前を呼びかける形は文の続きなので読点のまま
    （正しい例:「それは良いスタートです、ミキさん。」）。

  ## 読点

  読点は「間」です。合成音声が息継ぎなしに一息で喋り切るのを防ぐために打ちます。
  文の切れ目には上の「。」を、文の途中の息継ぎには「、」を使い分けてください。

  - ★読点を打たずに__COMMA_SPAN__文字以上続けない。長い発話は__COMMA_SPAN__文字前後ごとに
    「、」で区切る（実質100文字あたり__COMMA_PER_100__個が目安）。
  - ★★読点は**打ちすぎるほうが不自然**です。あなたは読点を過剰に打つ傾向が
    あります。実質100文字あたり__COMMA_PER_100__個を**超えない**こと。ひとまとまりの
    文節を読点で刻まないでください。
    - 悪い例:「私は、その、主婦、をしています。」← 「主婦をしています」は一続き。
    - 良い例:「私は、その、主婦をしています。」
  - ★「、」を2つ以上続けて書かない（「、、」「、、、」は禁止）。「。」「？」の直後に
    「、」を置かない（「。、」「？、」は禁止）。間を長く取りたいときも読点は1つだけ。
  - 息継ぎ・ためらい・間ができる位置、意味の切れ目に打つ。
  - 主題の後、接続の後、並列の間、理由と結論の間、述語の直前に打つ:
    - 悪い例:「来週から展示会が始まって資料が全然追いつかなくて焦ってるんだよね。」
    - 良い例:「来週から展示会が始まって、資料が全然追いつかなくて、焦ってるんだよね。」
    - 悪い例:「まずはリユースカップを学生に配布して使用率を上げました。」
    - 良い例:「まずは、リユースカップを学生に配布して、使用率を上げました。」
    - 悪い例:「どうやって盛り上げようか悩んでるんです。」
    - 良い例:「どうやって盛り上げようか、悩んでるんです。」（長い目的語・疑問節の後で切る）
  - 短い発話（10文字以下）には無理に打たない。

# ── 笑い ────────────────────────────────────────────────────────────────
# enriched_section の __LAUGH_SECTION__ に入る。dialogue.enrich.laugh_ratio が 0 なら
# 空になる（節ごと入らない）。人間コーパスの実測では発話ターンの 2.4% が笑い声で始まる。
laugh_section: |2

  ## 笑い

  - 相手が冗談を言った・失敗談を話した・大げさなことを言った・意外なことを言った、
    という場面でだけ、受け手の発話の冒頭に笑い声を置く。
    使ってよい形:「あはは」「はは」「ふふ」「ふふふ」「うふふ」（この後に必ず読点）。
    例:「あはは、それはさすがに盛りすぎでしょ。」「ふふ、わかる、私もやった。」
  - ★★笑う理由は**直前の発話の中に**なければいけません。直前の発話に
    「失敗談・大げさな言い方・意外な話・自虐・照れ」のどれかが**書かれている**ときだけ、
    その次の発話の冒頭に笑いを置いてください。理由が書かれていないなら0回で構いません。
    「打ち解けた雰囲気だから」という理由では置かないでください。
    - 悪い例（淡々とした説明への笑い）:
      A「検索ワードを絞ると効率が上がります。」
      B「あはは、検索ワードが鍵になるのは本当です。」
      → B「なるほど、検索ワードが鍵になるんですね。」
    - 悪い例（励まし・お礼・返事に笑いを付ける）:「ふふ、頑張ってください。」
      「あはは、了解です。」「あはは、どういたしまして。」
      → 「頑張ってください。」「了解です。」「どういたしまして。」
    - 良い例（直前が失敗談）:
      A「資料が間に合わなくて、展示が暗転しちゃったんだよね。」
      B「あはは、それは焦るね。」
  - 自分が笑っていることを言葉で説明しない
    （悪い例:「ちょっと笑っちゃいますね。」「これは笑えますね。」）。笑うなら笑い声で書く。
  - 分量: 多くても全ターンの約__LAUGH_PCT__%まで。連続するターンで笑い合わない。
  - 「（笑）」「(笑)」「笑」「w」のような記号・地の文では書かない。実際に口から出る
    音として書く（そのまま音声合成されるため）。
  - 深刻な相談・トラブル・謝罪・クレーム・体調や事故の話では使わない。
  - 1ターン目（会話の口火）には置かない。笑いだけのターンも作らない
    （必ず後ろに発話を続ける）。
  - 笑いと冒頭リアクション語（そう、なるほど等）を両方は付けない。
# ── 名乗り（self_name ゲート / dialogue.self_name_max）────────────────────
# ゲートを切る、または self_name_max > 0 のとき、本文の no_self_name_lines を
# allow_self_name_lines に差し替える（config_main_v1_gemma.yaml では既定のまま
# ＝名乗り禁止なので、下の allow_self_name_lines は使われない）。
no_self_name_lines: |
  - 対面の会話なので、名乗り・自己紹介（「ねえ、ユウだよ。」）をさせない。
  - 自分の発話の中に自分の名前を出さない。「ユウくん、どう思う？」のような
    呼びかけを、呼ばれている本人（ユウ）のセリフにしない（話者の取り違えに注意）。
allow_self_name_lines: |
  - 初対面どうしなので、会話の始めに名乗って自己紹介してよい（「ハルカです。」）。
    ただし名乗るのは一度だけにし、それ以外では自分の名前を口に出さない。
  - ★各 turn を書く前に、その speaker が「いま喋っている本人」かを確認する。
    発話の中で名前を口にするときは、それが**相手**の名前かを必ず確かめること。
    自分の名前で呼びかける（「ユウくん、どう思う？」をユウ本人のセリフにする）、
    自分を三人称で語る（サトウ本人が「サトウは〜」と話す）のはどちらも
    話者の取り違えで、不合格です。
# ── 長め発話の本数ノルマ（long_utterance ゲート）─────────────────────────
# ★このパックの主な調整箇所。ゲートは「句読点を除いて31文字以上」の発話を
#   3ターン（40ターン以上の対話では4ターン）要求する。_user 側は
#   build_dialogue_prompt がプロンプト末尾に足すノルマで、いちばん従いやすい位置。
# ゲートを切ったとき（dialogue.gates.long_utterance: false）は _free 側に替わる。
long_utt_quota_sys: |2
    — 全体の2割くらい。対話全体で6ターン以上入れる。
    ★句読点を除いて30文字以下の発話は、長めの発話として数えません。26〜30文字で
    止めず、「〜て、〜て、〜んですよ」ときっかけ・経緯・気持ちを続けて言い切ること。
long_utt_free_sys: |2
    — 話が乗ったところで自然に出る範囲でよく、本数のノルマとしては課さない。
    ★長めに書くときは、句読点を除いて30文字以下で止めず、「〜て、〜て、〜んですよ」と
    きっかけ・経緯・気持ちを続けて言い切ること。
long_utt_quota_user: 句読点を除いて31文字以上（読点を入れると35〜50文字）の長めの発話を6ターン以上、対話全体に散らして入れてください。書き終えたら、句読点を除いて31文字以上ある発話が6ターンあるか数え、足りなければ16〜30文字の発話をその数だけ長めに書き直してから出力してください。
long_utt_free_user: 話が乗ったところでは、読点で区切りながらひと息に話す31〜55文字の長めの発話も混ぜてください（本数は問いません）。
# ── プロンプトのプロファイル ────────────────────────────────────────────
# 本文が既に Gemma 向けなので差し替えは無し（上の (A) 参照）。ここを空のままに
# しておけば、dialogue.prompt_profile が gemma でも qwen でも本文がそのまま出る。
profile_patches:
  qwen: {}
  gemma: {}
