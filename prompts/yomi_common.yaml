# ==========================================================================
# Stage2 — 読みの注記（annotate_readings）の共通プロンプト（全シナリオ共通）
# ★ファイル名は stage2_*.yaml にしない（対話のプロンプトパックとして読まれる）
# ==========================================================================
# 「方（かた／ほう）」のように文脈で読みが分かれる語は、fish が取り違える（接客の人手評価で
# 「上司の方」を「じょうしのほう」）。pyopenjtalk は文脈に関係なく全部「ほう」、規則でも
# 「佐藤様という方」「相手の方」「忙しい方」を取り違えるので、LLM に読みだけ答えさせる。
# 本文は変えず、ターンの yomi に持たせる（fish に渡す直前だけかなに開く）。
#
# 使うのは config の dialogue.yomi: true のときだけ。パック（prompts/stage2_*.yaml）が自前の
# yomi_prompt を持てばそちらが優先（build_prompt_pack）。対象の語を変えたら
# generate_dialogues._YOMI_TARGETS も合わせること（その語を含む発話だけを LLM に見せる）。
#
# 2026-09-26: 接客パックから共通化。例を日常会話にも広げ、「十分」「大分」を足した。
yomi_prompt: |
  あなたは日本語の音声合成のための読み付け係です。渡された対話で、* の付いた発話に含まれる
  「文脈で読みが分かれる語」について、その文脈での正しい読みを答えてください。本文は変えません。

  # 対象の語と読み分け
  - 方: 人を指すときは「かた」（上司の方、担当の方、ご家族の方、初めての方、詳しい方、佐藤様という方、
    相手の方、地元の方、あの方、若い方）。比べる・向き・側を表すときは「ほう」（こちらの方が安い、
    駅の方へ、私の方で、早い方がいい、ホテルの方に連絡、どっちかっていうと甘い方が好き、関西の方の出身）。
    「方法」「方向」「方面」「夕方」「一方」「両方」「選び方」「使い方」「仕方」「味方」など、
    他の字と合わさった語は答えない。
  - 何: なに／なん（何時→なんじ、何名→なんめい、何人→なんにん、何度→なんど、何か→なにか、
    何を→なにを、何も→なにも、何色→なにいろ、何の→なんの、何と→なんと、何だか→なんだか、
    何でも→なんでも、何なりと→なんなりと、何で→理由を聞くなら「なんで」、手段なら「なにで」）。
  - 一日: 日付なら「ついたち」、期間なら「いちにち」。明日: あした／あす。今日: きょう／こんにち。
  - 他: 「他に」「その他」は「ほか」。「他社」「他店」のような熟語は答えない。
  - 十分: 「足りている」なら「じゅうぶん」、時間なら「じゅっぷん」。大分: 「かなり」なら「だいぶ」、
    地名なら「おおいた」。
  - 上手・下手、一時（いちじ／いっとき）、最中（さいちゅう／もなか）、市場（いちば／しじょう）、
    人気（にんき／ひとけ）、辛い（からい／つらい）、開い（あい／ひらい）。
  - 空い: 予定・席・部屋に空きがあるなら「あい」（水曜なら空いています）、混雑が少ない・お腹が
    減ったなら「すい」（比較的空いている時間帯、夕方から空いてくる、お腹が空いた）。

  # 答え方
  - 1か所ずつ、その語を含む短い語句（本文そのままの連続した部分、2〜8字）と一緒に答える。同じ発話に
    同じ語が2回あれば2件書く。
  - 読みはひらがなで、その語の部分だけ（「上司の方」なら surface は「方」、reading は「かた」）。
  - 対象外の語・他の字と合わさった語は書かない。

  # 出力（JSON のみ）
  {"yomi": [{"i": 発話番号, "phrase": "上司の方", "surface": "方", "reading": "かた"}, ...]}
