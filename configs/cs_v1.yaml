# =============================================================================
# Scenario: cs_v1 — Customer service (the system is the staff member, the user is the customer)
# =============================================================================
# Stage 1-2 (LLM -> scripts):  python pipeline/main.py --config configs/cs_v1.yaml
# Stage 3   (TTS + MaAI):      python pipeline/generate_tts.py --config configs/cs_v1.yaml --retime-refine
# Outputs go to data/cs_v1/ (final audio: data/cs_v1/audio/maai_ref/).
# Only the settings that differ from configs/base.yaml are listed here.
# =============================================================================
extends: base.yaml

log_file: data/cs_v1/generation.log
cost_log_file: data/cs_v1/cost_log.jsonl
metadata:
  num_speakers: 2
  output_file: data/cs_v1/metadata.jsonl
  scenario_file: scenarios/customer_service_persona.yaml
  main_speaker: {role: 担当者, persona_file: personas/inoue.yaml}
  # The bundled user-side voice bank (Mori) is male only, so user-side speakers are male for now.
  # After adding female voices (voices/<bank>/), restore the original mix: {男女: 0.5, 男性同士: 0.5, 女性同士: 0.0}
  pair_mix: {男女: 0.0, 男性同士: 1.0, 女性同士: 0.0}
dialogue:
  min_turns: 24
  max_turns: 38
  prompt_file: prompts/stage2_customer_service_persona.yaml
  output_file: data/cs_v1/dialogues.jsonl
  enrich: {filler_ratio: 0.15, filler_cap_ratio: 0.2, filler_floor: 0.0, head_filler_ratio: 0.0, sfp_ratio: 0.2, sfp_cap_ratio: 0.25,
    ne_cap_per_100: 0.5, comma_span: 16, comma_per_100: 6.0, comma_floor: 4.0, reaction_ratio: 0.15, react_floor: 0.0, monotone_head_cap: 3,
    readback_ne_window: 8, customer_echo_ne: true}
  proofread: 2
  self_name_max: 1
voice: {output_file: data/cs_v1/voice_dialogues.jsonl}
tts:
  log_file: data/cs_v1/tts.log
  audio_dir: data/cs_v1/audio
  manifest_file: data/cs_v1/audio_manifest.jsonl
  fish_speech: {multiturn: false, reading_normalize: true}
  retime:
    repair: {max_speech_overlap: 0.0}
  refine:
    ops_dir: data/cs_v1/refine_ops
    refined_records_file: data/cs_v1/voice_dialogues_refined.jsonl
    density: {min_bc_per_min: 6.0, max_bc_per_min: 15.0}
    quality:
      no_rewrite_speakers: ['@staff']
